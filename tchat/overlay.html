<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Tchat — Skelvo Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Overlay "tchat Twitch" à coller dans OBS (Source > Navigateur).

  Lecture du tchat en anonyme via le WebSocket IRC officiel de Twitch
  (pseudo justinfanXXXX) : aucun compte, aucune clé, rien côté serveur.
  Emotes Twitch via le CDN officiel ; emotes 7TV / BTTV / FFZ via leurs API
  publiques (facultatif, chargées après réception de l'identifiant de la
  chaîne dans ROOMSTATE).

  Tout le texte des messages passe par textContent / createTextNode : jamais
  d'innerHTML avec du contenu venant du tchat.
-->
<link rel="stylesheet" href="../assets/overlay.css?v=3">
<style>
  :root{ --fs: 20px; --gap: .35em; }
  html, body{ margin: 0; height: 100%; overflow: hidden; }
  body{ font-size: var(--fs); }

  #chat{ position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: var(--gap); padding: .6em; overflow: hidden; }
  body.right #chat{ align-items: flex-end; }
  body.left  #chat{ align-items: flex-start; }
  body.top #chat{ justify-content: flex-start; }

  .msg{ max-width: 100%; line-height: 1.38; overflow-wrap: anywhere; position: relative; font-weight: 500; }
  .meta{ display: inline-flex; align-items: center; gap: .3em; vertical-align: bottom; margin-right: .4em; white-space: nowrap; max-width: 100%; }
  .name{ overflow: hidden; text-overflow: ellipsis; }
  .name{ font-weight: var(--fw); text-transform: var(--up); letter-spacing: var(--ls); }
  .text .emote{ height: 1.5em; width: auto; vertical-align: middle; margin: -.25em .04em; display: inline-block; }
  .msg.emote-only .text .emote{ height: 2.4em; margin: 0 .04em; }
  .msg.action .text{ font-style: italic; color: var(--name-color); }

  .badges{ display: inline-flex; gap: .2em; }
  .badge{ width: 1.05em; height: 1.05em; border-radius: .28em; display: inline-grid; place-items: center; }
  .badge svg{ width: .68em; height: .68em; fill: #fff; }
  .b-broadcaster{ background: #e5484d; } .b-moderator{ background: #30a46c; } .b-vip{ background: #d6409f; }
  .b-subscriber{ background: var(--ac); } .b-subscriber svg{ fill: var(--ac-tx); } .b-partner{ background: #8e4ec6; } .b-artist{ background: #3e63dd; }
  .mono-badges .badge{ background: rgba(255,255,255,.14); } .mono-badges .badge svg{ fill: currentColor; }

  /* ---------- Mises en page (le style vient du thème) ---------- */
  .l-bubble .msg{ padding: .42em .78em .46em; }
  .l-card .msg{ padding: .5em .8em .6em; min-width: 7em; }
  .l-card .meta{ display: flex; margin: 0 0 .15em; font-size: .8em; }
  .l-card .msg::before{ content: ""; position: absolute; left: .8em; right: .8em; top: 0; height: .12em; border-radius: 0 0 .2em .2em; background: var(--name-color); opacity: .9; }
  .l-line .msg{ padding: .36em .7em .4em .85em; border-left-width: 0; }
  .l-line .msg::before{ content: ""; position: absolute; left: 0; top: .35em; bottom: .35em; width: .16em; border-radius: .2em; background: var(--name-color); }
  .l-clean .msg{ padding: .08em .1em; text-shadow: 0 0 .08em rgba(0,0,0,.95), 0 .04em .18em rgba(0,0,0,.85); }
  .l-clean .msg.sk-surface{ background: none; border: 0; box-shadow: none; }
  .l-stack .msg{ padding: .5em .8em; width: 100%; box-sizing: border-box; }
  .l-stack .meta{ display: flex; font-size: .78em; margin-bottom: .12em; }

  /* Événements (subs, raids…) */
  .msg.event{ border-color: transparent; }
  .msg.event .sys{ display: block; font-weight: var(--fw); }
  .msg.event .text{ display: block; margin-top: .15em; opacity: .95; }
  .ev-accent .msg.event{ background: linear-gradient(135deg, var(--ac), var(--ac2)); color: var(--ac-tx); text-shadow: none; }
  .ev-outline .msg.event{ box-shadow: inset 0 0 0 .1em var(--ac), var(--shadow), var(--glow); }
  .ev-outline .msg.event .sys{ color: var(--ac); }

  /* ---------- Animations ---------- */
  .a-slide .msg{ animation: inSlide .45s cubic-bezier(.2,.9,.25,1) both; }
  body.right.a-slide .msg{ animation-name: inSlideR; }
  .a-fade  .msg{ animation: inFade .45s ease both; }
  .a-pop   .msg{ animation: inPop .4s cubic-bezier(.2,.9,.3,1.3) both; }
  .a-rise  .msg{ animation: inRise .5s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes inSlide{ from{ opacity: 0; transform: translateX(-1.2em); } }
  @keyframes inSlideR{ from{ opacity: 0; transform: translateX(1.2em); } }
  @keyframes inFade{ from{ opacity: 0; } }
  @keyframes inPop{ from{ opacity: 0; transform: scale(.7); } }
  @keyframes inRise{ from{ opacity: 0; transform: translateY(.8em); filter: blur(4px); } }
  .msg.out{ animation: out .5s ease forwards !important; }
  @keyframes out{ to{ opacity: 0; transform: translateY(-.3em); } }
</style>
</head>
<body>
<div id="chat" aria-live="polite"></div>

<script src="../assets/overlay.js?v=3"></script>
<script src="../assets/twitch.js?v=5"></script>
<script>
(function(){
  'use strict';

  var DEFAULTS = Object.assign({}, SKO.THEME, {
    ch: '', theme: 'bubble', fs: '20', gap: '35', max: '12', fade: '0',
    align: 'left', vpos: 'bottom', anim: 'slide', names: 'twitch', evs: 'accent', bmono: '0',
    badges: '1', emotes3: '1', hidecmd: '1', events: '1',
    bots: 'nightbot,streamelements,streamlabs,moobot,fossabot,wizebot,sery_bot',
    demo: '0'
  });
  var num = SKO.num, hex = SKO.hex, el = SKO.el;
  var chatEl = document.getElementById('chat');
  var P = {}, hidden = {}, source = null, sourceKey = '';

  // Couleur de pseudo : celle de Twitch, éclaircie si elle est illisible sur fond sombre
  var FALLBACK = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#38d9a9', '#4dabf7', '#9775fa', '#f783ac', '#63e6be', '#ff922b'];
  // Couleur de pseudo : celle de Twitch, ajustée pour rester lisible sur le fond du thème
  function nameColor(raw, login){
    if (P.sk === 'accent') return 'var(--tx)';
    if (P.names === 'accent') return hex(P.ac, DEFAULTS.ac);
    if (P.names === 'white' || P.names === 'text') return hex(P.tx, 'ffffff');
    var c;
    if (!/^#[0-9a-f]{6}$/i.test(raw || '')){
      var h = 0; for (var i = 0; i < login.length; i++) h = (h * 31 + login.charCodeAt(i)) >>> 0;
      c = SKO.rgb(FALLBACK[h % FALLBACK.length]);
    } else c = SKO.rgb(raw);
    var lum = (c[0] * 299 + c[1] * 587 + c[2] * 114) / 1000;
    // Fond clair (thème Clair, Pastel…) : on fonce les couleurs trop pâles ; fond sombre : on éclaircit les trop foncées
    var bg = SKO.rgb(hex(P.sf, '000000')), bgLum = (bg[0] * 299 + bg[1] * 587 + bg[2] * 114) / 1000;
    var lightBg = P.sk !== 'none' && P.sk !== 'outline' && P.theme !== 'clean' && bgLum > 160 && num(P.so, 0, 100, 78) > 45;
    if (lightBg && lum > 120){ var d = Math.min(.75, (lum - 120) / 180 + .3); c = c.map(function(v){ return v * (1 - d); }); }
    else if (!lightBg && lum < 110){ var k = (110 - lum) / 160 + .25; c = c.map(function(v){ return v + (255 - v) * k; }); }
    return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
  }

  // ---------- Badges (dessinés ici : l'API officielle demande un compte) ----------
  var ICONS = {
    broadcaster: '<svg viewBox="0 0 16 16"><path d="M2 4h8a1 1 0 0 1 1 1v1.5L14 4v8l-3-2.5V11a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg>',
    moderator:   '<svg viewBox="0 0 16 16"><path d="M13 1l2 2-7.5 7.5 1.5 1.5-1.5 1.5-1.5-1.5L3 15H1v-2l3-3-1.5-1.5L4 7l1.5 1.5z"/></svg>',
    vip:         '<svg viewBox="0 0 16 16"><path d="M4 2h8l3 4-7 8-7-8z"/></svg>',
    subscriber:  '<svg viewBox="0 0 16 16"><path d="M8 1l2.1 4.5 4.9.6-3.6 3.3.9 4.8L8 11.8 3.7 14.2l.9-4.8L1 6.1l4.9-.6z"/></svg>',
    partner:     '<svg viewBox="0 0 16 16"><path d="M6.5 12L2 7.5l1.5-1.5 3 3 6-6L14 4.5z"/></svg>',
    artist:      '<svg viewBox="0 0 16 16"><path d="M3 13c3 0 4-1.5 4-3.5L11 5l-1-1-4.5 4C3.5 8 2 9 2 12zM12 1l3 3-2 2-3-3z"/></svg>'
  };
  function badgesEl(raw){
    if (P.badges !== '1' || !raw) return null;
    var wrap = el('span', 'badges'), seen = {};
    raw.split(',').forEach(function(b){
      var k = b.split('/')[0];
      if (k === 'founder') k = 'subscriber';
      if (k === 'artist-badge') k = 'artist';
      if (!ICONS[k] || seen[k]) return;
      seen[k] = 1;
      var s = el('span', 'badge b-' + k);
      s.innerHTML = ICONS[k]; // SVG constant défini ci-dessus, jamais du contenu du tchat
      wrap.appendChild(s);
    });
    return wrap.childNodes.length ? wrap : null;
  }

  // ---------- Affichage ----------
  function show(m){
    var div = el('div', 'msg sk-surface');
    if (m.id) div.dataset.id = m.id;
    if (m.uid) div.dataset.uid = m.uid;
    var col = nameColor(m.color, m.login || '');
    div.dataset.c = m.color || ''; div.dataset.l = m.login || '';
    div.style.setProperty('--name-color', col);
    var third = P.emotes3 === '1';

    if (m.event){
      div.classList.add('event');
      div.appendChild(el('span', 'sys', m.sys));
      if (m.text) div.appendChild(SKT.renderText(m.text, m.emotes, third).node);
    } else {
      var meta = el('span', 'meta');
      var b = badgesEl(m.badges); if (b) meta.appendChild(b);
      var name = el('span', 'name', m.name); name.style.color = col;
      if (!m.action && P.theme === 'clean') name.appendChild(document.createTextNode(':'));
      meta.appendChild(name);
      div.appendChild(meta);
      var tx = SKT.renderText(m.text, m.emotes, third);
      if (tx.emoteOnly) div.classList.add('emote-only');
      if (m.action) div.classList.add('action');
      div.appendChild(tx.node);
    }

    chatEl.appendChild(div);
    trim();
    var fade = num(P.fade, 0, 600, 0);
    if (fade > 0) setTimeout(function(){ removeMsg(div); }, fade * 1000);
  }
  function removeMsg(div){
    if (!div.parentNode || div.classList.contains('out')) return;
    div.classList.add('out');
    setTimeout(function(){ div.remove(); }, 520);
  }
  function trim(){
    var max = num(P.max, 1, 50, 12);
    var live = chatEl.querySelectorAll('.msg:not(.out)');
    for (var i = 0; i < live.length - max; i++) live[i].remove();
    // Ce qui est sorti par le haut de l'écran ne se voit plus : on le retire
    // (avec justify-content: flex-end, ce débordement n'apparaît pas dans scrollHeight)
    var first = chatEl.firstElementChild;
    while (first && chatEl.children.length > 1 && first.offsetTop + first.offsetHeight <= 0){ first.remove(); first = chatEl.firstElementChild; }
  }

  var handlers = {
    status: function(state, ch){ SKO.tellParent(state, { channel: ch }); },
    room: function(id){ if (P.emotes3 === '1') SKT.loadChannelEmotes(id); },
    message: function(m){
      if (hidden[m.login]) return;
      if (P.hidecmd === '1' && m.text.charAt(0) === '!') return;
      show(m);
    },
    event: function(e){
      if (P.events !== '1') return;
      if (e.type === 'bits' || e.type === 'upgrade' || (e.type === 'subgift' && e.fromBomb)) return; // bits : déjà visibles dans le message
      var sys = e.sys;
      if (e.type === 'announcement') sys = '📣 ' + e.name;
      if (!sys) return;
      show({ event: true, sys: sys, text: e.text, emotes: e.emotes, login: e.login, color: e.color });
    },
    clear: function(c){
      chatEl.querySelectorAll('.msg').forEach(function(d){
        if (c.all || (c.msgId && d.dataset.id === c.msgId) || (c.userId && d.dataset.uid === c.userId)) d.remove();
      });
    }
  };

  SKO.params(DEFAULTS, function(p){
    P = p;
    // Anciens liens : "bgo" (opacité) devient "so", "grotesk" reste une police valide
    if (p.bgo != null && !/[?&]so=/.test(location.search) && P === p) P.so = p.bgo;
    SKO.theme(P);
    var root = document.documentElement.style;
    root.setProperty('--fs', num(P.fs, 10, 72, 20) + 'px');
    root.setProperty('--gap', num(P.gap, 0, 150, 35) / 100 + 'em');

    var layout = { bubble: 'bubble', clean: 'clean', neon: 'line', line: 'line', card: 'card', stack: 'stack' }[P.theme] || 'bubble';
    var anim = /^(slide|fade|pop|rise|none)$/.test(P.anim) ? P.anim : 'slide';
    document.body.className = ['l-' + layout, 'a-' + anim, P.align === 'right' ? 'right' : 'left', P.vpos === 'top' ? 'top' : '',
      'ev-' + (P.evs === 'outline' ? 'outline' : P.evs === 'none' ? 'none' : 'accent'), P.bmono === '1' ? 'mono-badges' : ''].join(' ');

    // Recolore les pseudos déjà affichés (changement de thème dans l'éditeur)
    chatEl.querySelectorAll('.msg').forEach(function(d){
      var c = nameColor(d.dataset.c, d.dataset.l || '');
      d.style.setProperty('--name-color', c);
      var n = d.querySelector('.name'); if (n) n.style.color = c;
    });

    hidden = {};
    String(P.bots || '').toLowerCase().split(/[\s,;]+/).forEach(function(b){ if (b) hidden[b.replace(/^@/, '')] = 1; });
    if (P.emotes3 === '1') SKT.loadGlobalEmotes();
    trim();

    var key = P.demo === '1' ? 'demo' : SKT.cleanChannel(P.ch);
    if (key !== sourceKey){
      sourceKey = key;
      if (source) source.close();
      chatEl.textContent = '';
      source = key === 'demo' ? SKT.demo(handlers, { events: true, burst: 5 }) : SKT.connect(key, handlers);
    }
  });
})();
</script>
</body>
</html>
