<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Alertes — Skelvo Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Alertes d'abonnement, de subs offerts, de bits et de raids, sans connexion
  (lues dans le tchat Twitch). Les alertes passent une par une (file d'attente).
  Les sons sont synthétisés avec WebAudio : aucun fichier à héberger.
  Les follows demandent une connexion Twitch : prévus dans une version suivante.
-->
<link rel="stylesheet" href="../assets/overlay.css?v=4">
<style>
  :root{ --fs: 34px; }
  html, body{ margin: 0; height: 100%; overflow: hidden; }
  body{ font-size: var(--fs); }
  #stage{ position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: .5em; box-sizing: border-box; }
  .pos-top #stage{ align-items: flex-start; } .pos-bottom #stage{ align-items: flex-end; }
  .pos-left #stage{ justify-content: flex-start; } .pos-right #stage{ justify-content: flex-end; }

  .alert{ position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 92%; padding: .75em 1.2em .85em; }
  .icon{ font-size: 2.3em; line-height: 1; margin-bottom: .18em; filter: drop-shadow(0 .05em .2em rgba(0,0,0,.4)); }
  .icon img{ max-height: var(--imgh, 3.6em); max-width: 9em; display: block; }
  .title{ font-weight: var(--fw); text-transform: var(--up); letter-spacing: var(--ls); line-height: 1.12; }
  .title b{ color: var(--ac); text-shadow: var(--glow-text); font-weight: inherit; }
  .sk-accent .title b{ color: inherit; text-shadow: none; text-decoration: underline; text-decoration-thickness: .06em; text-underline-offset: .12em; }
  .msg{ margin-top: .45em; font-size: .6em; font-weight: 500; max-width: 26em; color: var(--muted); overflow-wrap: anywhere; }
  .sk-accent .msg{ color: inherit; opacity: .9; }
  .msg .emote{ height: 1.5em; vertical-align: middle; margin: -.2em .05em; }
  .bar{ position: absolute; left: 0; bottom: 0; height: .1em; background: linear-gradient(90deg, var(--ac), var(--ac2)); border-radius: 0 .1em .1em 0; animation: timebar var(--dur) linear forwards; }
  @keyframes timebar{ from{ width: 100%; } to{ width: 0; } }
  .no-bar .bar{ display: none; }

  /* Mises en page */
  .l-banner .alert{ flex-direction: row; gap: .7em; text-align: left; align-items: center; padding: .5em 1.1em .55em .6em; }
  .l-banner .icon{ font-size: 1.5em; margin: 0; } .l-banner .icon img{ max-height: 2em; }
  .l-banner .msg{ margin-top: .15em; }
  .l-big .alert.sk-surface{ background: none; border: 0; box-shadow: none; text-shadow: 0 .05em .3em rgba(0,0,0,.65); }
  .l-big .title{ font-size: 1.35em; } .l-big .icon{ font-size: 3.4em; }
  .l-big .msg{ color: var(--tx); }

  /* Animations d'entrée */
  .in-pop{ animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
  .in-slide{ animation: slide .6s cubic-bezier(.2,1,.3,1) both; }
  .in-side{ animation: side .6s cubic-bezier(.2,1,.3,1) both; }
  .in-bounce{ animation: bounce .9s cubic-bezier(.3,1.6,.5,1) both; }
  .in-zoom{ animation: zoom .7s cubic-bezier(.16,1,.3,1) both; }
  .in-fade{ animation: fade .6s ease both; }
  .out{ animation: out .45s ease forwards !important; }
  @keyframes pop{ from{ opacity: 0; transform: scale(.4); } }
  @keyframes slide{ from{ opacity: 0; transform: translateY(-1.5em); } }
  @keyframes side{ from{ opacity: 0; transform: translateX(-2em); } }
  @keyframes bounce{ 0%{ opacity: 0; transform: translateY(2em) scale(.8); } 60%{ opacity: 1; transform: translateY(-.25em) scale(1.04); } }
  @keyframes zoom{ from{ opacity: 0; transform: scale(1.6); filter: blur(10px); } }
  @keyframes fade{ from{ opacity: 0; } }
  @keyframes out{ to{ opacity: 0; transform: scale(.94) translateY(-.3em); } }
  .wiggle .icon{ animation: wiggle 1.4s ease-in-out .5s infinite; }
  @keyframes wiggle{ 0%,100%{ transform: rotate(0); } 25%{ transform: rotate(-7deg) scale(1.06); } 75%{ transform: rotate(7deg); } }

  .confetti{ position: absolute; left: 50%; top: 50%; width: .26em; height: .42em; border-radius: .06em; animation: conf 1.8s cubic-bezier(.15,.7,.4,1) forwards; pointer-events: none; }
  @keyframes conf{ from{ transform: translate(-50%,-50%) rotate(0); opacity: 1; } to{ transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
</style>
</head>
<body>
<div id="stage"></div>

<script src="../assets/overlay.js?v=5"></script>
<script src="../assets/twitch.js?v=6"></script>
<script>
(function(){
  'use strict';
  var DEFAULTS = Object.assign({}, SKO.THEME, {
    ch: '', style: 'card', anim: 'pop', dur: '7', sound: 'chime', vol: '60', confetti: '1', showmsg: '1', emotes3: '1',
    sub: '1', gift: '1', bits: '1', raid: '1', minbits: '1', minraid: '1',
    tsub: SKO.tr('{name} s\'abonne !'), tresub: SKO.tr('{name} se réabonne · {months} mois !'), tgift: SKO.tr('{name} offre un abonnement à {recipient} !'),
    tbomb: SKO.tr('{name} offre {count} abonnements !'), tfollow: SKO.tr('{name} suit la chaîne !'), treward: SKO.tr('{name} utilise « {reward} »'), ttip: SKO.tr('{name} fait un don de {amount} !'),
    follow: '1', reward: '1', tip: '1', mintip: '0', ifollow: '💜', ireward: '✨', itip: '💸', tk: '', se: '', tbits: SKO.tr('{name} envoie {amount} bits !'), traid: SKO.tr('Raid de {name} avec {count} viewers !'),
    img: '', isub: '⭐', igift: '🎁', ibits: '💎', iraid: '🚀', img_sub: '', img_gift: '', img_bits: '', img_raid: '', imgh: '3.6',
    snd: '', pos: 'center', timebar: '1', wiggle: '1', fs: '34', demo: '0'
  });
  var ICONS = { sub: '⭐', resub: '🌟', subgift: '🎁', giftbomb: '🎉', bits: '💎', raid: '🚀', follow: '💜', reward: '✨', tip: '💸' };
  var extra = []; // connexions Twitch (follows, points) et StreamElements (dons)
  var num = SKO.num, el = SKO.el;
  var stage = document.getElementById('stage');
  var P = {}, queue = [], busy = false, source = null, sourceKey = '';

  /* ---------- Sons synthétisés ---------- */
  var actx = null;
  function play(kind){
    if (kind === 'none') return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var vol = num(P.vol, 0, 100, 60) / 100, t0 = actx.currentTime + .02;
      var master = actx.createGain(); master.gain.value = vol * .5; master.connect(actx.destination);
      function note(freq, at, len, type, g){
        var o = actx.createOscillator(), e = actx.createGain();
        o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0 + at);
        e.gain.setValueAtTime(0, t0 + at); e.gain.linearRampToValueAtTime(g || .6, t0 + at + .015);
        e.gain.exponentialRampToValueAtTime(.001, t0 + at + len);
        o.connect(e); e.connect(master); o.start(t0 + at); o.stop(t0 + at + len + .05);
      }
      var S = {
        chime:   function(){ [[880, 0], [1318.5, .12], [1760, .24]].forEach(function(n){ note(n[0], n[1], .9, 'sine'); }); },
        fanfare: function(){ [[523.25, 0], [659.25, .14], [783.99, .28], [1046.5, .42]].forEach(function(n, i){ note(n[0], n[1], i === 3 ? 1 : .3, 'triangle', .5); }); },
        coin:    function(){ note(987.77, 0, .1, 'square', .25); note(1318.5, .09, .5, 'square', .25); },
        pop:     function(){ var o = actx.createOscillator(), e = actx.createGain(); o.frequency.setValueAtTime(320, t0); o.frequency.exponentialRampToValueAtTime(900, t0 + .12);
                   e.gain.setValueAtTime(.7, t0); e.gain.exponentialRampToValueAtTime(.001, t0 + .25); o.connect(e); e.connect(master); o.start(t0); o.stop(t0 + .3); },
        arcade:  function(){ [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function(f, i){ note(f, i * .06, .18, 'square', .22); }); }
      };
      (S[kind] || S.chime)();
    } catch(e){}
  }

  /* ---------- Texte de l'alerte : "{name} offre {count}…" avec le pseudo en couleur ---------- */
  function fill(tpl, e){
    var frag = document.createDocumentFragment();
    String(tpl || '').split(/(\{\w+\})/).forEach(function(part){
      var m = /^\{(\w+)\}$/.exec(part);
      if (!m){ if (part) frag.appendChild(document.createTextNode(part)); return; }
      var amount = e.type === 'tip' ? (Number(e.amount) || 0).toLocaleString(SKO.locale, { maximumFractionDigits: 2 }) + ' ' + (e.currency === 'EUR' ? '€' : e.currency || '€') : e.amount;
      var v = { name: e.name, months: e.months, count: e.count, amount: amount, recipient: e.recipient, tier: e.tier, reward: e.reward, cost: e.cost }[m[1]];
      if (v == null) v = '';
      frag.appendChild(m[1] === 'name' || m[1] === 'recipient' ? el('b', '', String(v)) : document.createTextNode(String(v)));
    });
    return frag;
  }

  function confetti(box){
    var cs = getComputedStyle(document.documentElement), cols = [cs.getPropertyValue('--ac'), cs.getPropertyValue('--ac2'), '#ffd700', '#ff5c8a', '#fff'];
    for (var i = 0; i < 60; i++){
      var c = el('i', 'confetti');
      c.style.background = cols[i % cols.length];
      var a = Math.random() * Math.PI * 2, d = 3 + Math.random() * 6;
      c.style.setProperty('--dx', Math.cos(a) * d + 'em'); c.style.setProperty('--dy', Math.sin(a) * d - 1 + 'em');
      c.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
      c.style.animationDelay = Math.random() * .15 + 's';
      box.appendChild(c); setTimeout(c.remove.bind(c), 2200);
    }
  }

  function showNext(){
    if (busy || !queue.length) return;
    busy = true;
    var e = queue.shift();
    var tpl = { sub: P.tsub, resub: P.tresub, subgift: P.tgift, giftbomb: P.tbomb, bits: P.tbits, raid: P.traid, follow: P.tfollow, reward: P.treward, tip: P.ttip }[e.type];
    var a = el('div', 'alert sk-surface in-' + (/^(pop|slide|side|bounce|zoom|fade)$/.test(P.anim) ? P.anim : 'pop'));
    var icon = el('div', 'icon');
    var kind = e.type === 'sub' || e.type === 'resub' ? 'sub' : e.type === 'subgift' || e.type === 'giftbomb' ? 'gift' : e.type;
    var src = SKO.safeImage(P['img_' + kind]) || SKO.safeImage(P.img);
    if (src){ var im = new Image(); im.src = src; im.alt = ''; icon.appendChild(im); }
    else icon.textContent = P['i' + kind] != null ? P['i' + kind] : (ICONS[e.type] || '✨');
    if (!icon.textContent && !src) icon.style.display = 'none';
    a.appendChild(icon);
    var body = el('div', 'body');
    var t = el('div', 'title'); t.appendChild(fill(tpl, e)); body.appendChild(t);
    if (P.showmsg === '1' && e.text && e.type !== 'raid'){
      var text = e.type === 'bits' ? e.text.replace(/\b[a-z]+\d+\b/gi, '').trim() : e.text;
      if (text){ var m = SKT.renderText(text, e.type === 'bits' ? '' : e.emotes, P.emotes3 === '1').node; m.className = 'msg'; body.appendChild(m); }
    }
    a.appendChild(body);
    var dur = num(P.dur, 2, 30, 7) * 1000;
    a.style.setProperty('--dur', dur + 'ms'); a.appendChild(el('i', 'bar'));
    stage.appendChild(a);
    var snd = /^https:\/\/\S+$/i.test(P.snd || '') ? P.snd : '';
    if (snd){ try { var au = new Audio(snd); au.volume = num(P.vol, 0, 100, 60) / 100; au.play().catch(function(){}); } catch(err){} }
    else play(P.sound);
    if (P.confetti === '1') confetti(stage);
    setTimeout(function(){
      a.classList.add('out');
      setTimeout(function(){ a.remove(); busy = false; setTimeout(showNext, 400); }, 460);
    }, dur);
  }

  function onEvent(e){
    if ((e.type === 'sub' || e.type === 'resub') && P.sub !== '1') return;
    if (e.type === 'resub' && e.months <= 1) e.type = 'sub';
    if (e.type === 'subgift' && (P.gift !== '1' || e.fromBomb)) return;
    if (e.type === 'giftbomb' && P.gift !== '1') return;
    if (e.type === 'bits' && (P.bits !== '1' || e.amount < num(P.minbits, 1, 1e6, 1))) return;
    if (e.type === 'raid' && (P.raid !== '1' || e.count < num(P.minraid, 1, 1e6, 1))) return;
    if (e.type === 'follow' && P.follow !== '1') return;
    if (e.type === 'reward' && P.reward !== '1') return;
    if (e.type === 'tip' && (P.tip !== '1' || Number(e.amount) < num(P.mintip, 0, 1e6, 0))) return;
    if (!/^(sub|resub|subgift|giftbomb|bits|raid|follow|reward|tip)$/.test(e.type)) return;
    if (queue.length > 30) queue.shift();
    queue.push(e); showNext();
  }

  // Bouton « Tester » de l'éditeur
  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || !e.data || e.data.type !== 'sk-test') return;
    var ev = Object.assign({}, e.data.event); ev.emotes = SKT.demoEmotesTag(ev.text || '');
    onEvent(ev);
  });

  SKO.params(DEFAULTS, function(p){
    P = p;
    SKO.theme(P);
    var root = document.documentElement.style;
    root.setProperty('--fs', num(P.fs, 14, 90, 34) + 'px');
    root.setProperty('--imgh', num(P.imgh, 1, 10, 3.6) + 'em');
    var st = { card: 'card', neon: 'card', banner: 'banner', clean: 'big', big: 'big' }[P.style] || 'card';
    var pos = /^(center|top|bottom|left|right)$/.test(P.pos) ? P.pos : 'center';
    document.body.className = ['l-' + st, 'pos-' + pos, P.timebar === '1' ? '' : 'no-bar', P.wiggle === '1' ? 'wiggle' : ''].join(' ');
    if (P.emotes3 === '1') SKT.loadGlobalEmotes();

    var sk = P.demo === '1' ? 'demo' : SKT.cleanChannel(P.ch);
    if (sk !== sourceKey){
      sourceKey = sk;
      if (source) source.close();
      extra.forEach(function(x){ if (x) x.close(); }); extra = [];
      if (sk !== 'demo'){
        if (P.tk) extra.push(SKT.eventsub(P.tk, { event: onEvent, authStatus: function(st, i){ SKO.tellParent('auth-' + st, i || {}); } }));
        if (P.se) extra.push(SKT.streamelements(P.se, { event: onEvent }));
      }
      queue = [];
      var h = { status: function(s, ch){ SKO.tellParent(s, { channel: ch }); }, room: function(id){ if (P.emotes3 === '1') SKT.loadChannelEmotes(id); }, event: onEvent };
      if (sk === 'demo'){
        var seq = [
          { type: 'follow', name: 'Zoé_42', text: '' },
          { type: 'tip', amount: 5, currency: 'EUR', name: 'BaguetteMan', text: SKO.tr('Merci pour les lives !') },
          { type: 'sub', tier: 1, months: 1, name: 'Lunaa_', text: SKO.tr('Trop contente d\'être là <3') },
          { type: 'bits', amount: 500, name: 'KevGaming', text: SKO.tr('Cheer500 GG pour la win !') },
          { type: 'giftbomb', count: 5, tier: 1, name: 'Mamie_Gameuse', text: '' },
          { type: 'raid', count: 42, name: 'Choupette', text: '' },
          { type: 'resub', tier: 1, months: 14, name: 'Tonton_Raclette', text: SKO.tr('Toujours fidèle au poste SeemsGood') },
          { type: 'subgift', tier: 1, name: 'PixelPaulo', recipient: 'xXDarkSasukeXx', text: '' }
        ];
        var i = 0;
        source = SKT.demo(h, { min: 2500, spread: 0, extra: function(){
          if (queue.length) return { type: 'none' };
          var e = Object.assign({}, seq[i++ % seq.length]); e.emotes = SKT.demoEmotesTag(e.text || ''); return e;
        } });
      } else source = SKT.connect(sk, h);
    }
  });
})();
</script>
</body>
</html>
