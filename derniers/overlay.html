<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Derniers et tops — Skelvo Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/overlay.css?v=3">
<!--
  Dernier abonné, dernier sub offert, dernier raid, derniers bits,
  top bits et top donneur de subs du jour. Lus dans le tchat Twitch,
  mémorisés dans OBS. Les « tops » repartent à zéro chaque jour
  (ou avec !derniers reset pour les modos).
-->
<style>
  :root{ --fs: 24px; }
  html, body{ margin: 0; height: 100%; overflow: hidden; }
  body{ font-size: var(--fs); display: flex; align-items: center; justify-content: var(--justify, flex-start); padding: 0 .4em; box-sizing: border-box; }
  .list{ display: flex; gap: .45em; }
  .l-list .list{ flex-direction: column; align-items: stretch; }
  .l-row .list{ flex-direction: row; flex-wrap: wrap; }
  .item{ display: flex; align-items: center; gap: .55em; padding: .42em .8em .46em .5em; min-width: 0; }
  .ico{ flex: none; width: 1.7em; height: 1.7em; border-radius: calc(var(--rad) * .6); display: grid; place-items: center; font-size: .82em; background: linear-gradient(135deg, var(--ac), var(--ac2)); color: var(--ac-tx); }
  .no-ico .ico{ display: none; } .no-ico .item{ padding-left: .8em; }
  .txt{ min-width: 0; line-height: 1.15; }
  .lab{ font-size: .55em; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .sk-accent .lab{ color: inherit; opacity: .8; }
  .val{ font-weight: var(--fw); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: var(--up); letter-spacing: var(--ls); }
  .val small{ font-weight: 600; color: var(--ac); margin-left: .35em; text-transform: none; }
  .sk-accent .val small{ color: inherit; opacity: .85; }
  .l-rotate .item{ animation: swap .6s cubic-bezier(.2,1,.3,1) both; }
  .l-rotate .item.out{ animation: swapOut .4s ease forwards; }
  @keyframes swap{ from{ opacity: 0; transform: translateY(.6em); filter: blur(4px); } }
  @keyframes swapOut{ to{ opacity: 0; transform: translateY(-.5em); } }
  .flash{ animation: flash 1.2s ease; }
  @keyframes flash{ 30%{ box-shadow: 0 0 0 .12em var(--ac), var(--shadow); transform: scale(1.04); } }
</style>
</head>
<body>
<div class="list" id="list"></div>

<script src="../assets/overlay.js?v=3"></script>
<script src="../assets/twitch.js?v=5"></script>
<script>
(function(){
  'use strict';
  var DEFAULTS = Object.assign({}, SKO.THEME, {
    ch: '', i_sub: '1', i_gift: '1', i_raid: '1', i_bits: '1', i_topbits: '1', i_topgift: '1', i_topchat: '1', i_follow: '0', i_tip: '0', tk: '', se: '', layout: 'rotate', every: '6', icons: '1', align: 'left', fs: '24', empty: '—', demo: '0'
  });
  var LABELS = { sub: 'Dernier abonné', gift: 'Dernier sub offert', raid: 'Dernier raid', bits: 'Derniers bits', topbits: 'Top bits du jour', topgift: 'Top donneur du jour', topchat: 'Top tchatteur du jour', follow: 'Dernier follow', tip: 'Dernier don' };
  var ICONS = { sub: '⭐', gift: '🎁', raid: '🚀', bits: '💎', topbits: '👑', topgift: '🏆', topchat: '💬', follow: '💜', tip: '💸' };
  var num = SKO.num, el = SKO.el;
  var list = document.getElementById('list');
  var P = {}, D = null, key = '', source = null, sourceKey = '', rot = 0, rotTimer = null;

  function today(){ var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function load(){
    D = SKO.store.get(key) || {};
    if (D.day !== today()){ D.topbits = null; D.topgift = null; D.bitsBy = {}; D.giftBy = {}; D.day = today(); }
    D.bitsBy = D.bitsBy || {}; D.giftBy = D.giftBy || {};
  }
  function save(){ SKO.store.set(key, D); }

  function value(k){
    if (k === 'topchat'){
      var st = P.demo === '1' ? { msgs: { a: { n: 'Lunaa_', c: 148 } } } : SKT.stats.day(P.ch);
      var t = SKT.stats.top(st && st.msgs, 1)[0];
      return t ? { n: t.name, x: t.count + ' msg' } : null;
    }
    var v = D[k]; if (!v) return null;
    if (k === 'gift' || k === 'topgift') return { n: v.n, x: v.c > 1 ? '×' + v.c : '' };
    if (k === 'raid') return { n: v.n, x: v.c + ' viewers' };
    if (k === 'tip') return { n: v.n, x: v.c };
    if (k === 'follow') return { n: v.n, x: '' };
    if (k === 'bits' || k === 'topbits') return { n: v.n, x: v.c + ' bits' };
    if (k === 'sub') return { n: v.n, x: v.m > 1 ? v.m + ' mois' : '' };
    return { n: v.n, x: '' };
  }
  function itemEl(k){
    var d = el('div', 'item sk-surface'); d.dataset.k = k;
    d.appendChild(el('span', 'ico', ICONS[k]));
    var t = el('div', 'txt'); t.appendChild(el('div', 'lab', LABELS[k]));
    var v = value(k), val = el('div', 'val', v ? v.n : (P.empty || '—'));
    if (v && v.x) val.appendChild(el('small', '', v.x));
    t.appendChild(val); d.appendChild(t);
    return d;
  }
  function keys(){ return Object.keys(LABELS).filter(function(k){ return P['i_' + k] === '1'; }); }
  function render(flashKey){
    clearInterval(rotTimer);
    var ks = keys(); list.textContent = '';
    if (!ks.length) return;
    if (P.layout === 'rotate'){
      if (flashKey && ks.indexOf(flashKey) >= 0) rot = ks.indexOf(flashKey);
      var show = function(){
        var old = list.firstChild; if (old){ old.classList.add('out'); setTimeout(function(){ old.remove(); }, 380); }
        var n = itemEl(ks[rot % ks.length]); if (flashKey && ks[rot % ks.length] === flashKey){ n.classList.add('flash'); flashKey = null; }
        setTimeout(function(){ list.appendChild(n); }, old ? 380 : 0);
        rot++;
      };
      show(); rotTimer = setInterval(show, num(P.every, 2, 60, 6) * 1000);
    } else {
      ks.forEach(function(k){ var n = itemEl(k); if (k === flashKey) n.classList.add('flash'); list.appendChild(n); });
    }
  }

  function onEvent(e){
    var changed = null;
    if (e.type === 'sub' || e.type === 'resub'){ D.sub = { n: e.name, m: e.months || 1 }; changed = 'sub'; }
    else if (e.type === 'giftbomb'){
      D.gift = { n: e.name, c: e.count }; changed = 'gift';
      D.giftBy[e.name] = (D.giftBy[e.name] || 0) + e.count;
    } else if (e.type === 'subgift' && !e.fromBomb){
      D.gift = { n: e.name, c: 1 }; changed = 'gift';
      D.giftBy[e.name] = (D.giftBy[e.name] || 0) + 1;
    } else if (e.type === 'raid'){ D.raid = { n: e.name, c: e.count }; changed = 'raid'; }
    else if (e.type === 'bits'){
      D.bits = { n: e.name, c: e.amount }; changed = 'bits';
      D.bitsBy[e.name] = (D.bitsBy[e.name] || 0) + e.amount;
    }
    if (!changed) return;
    // Tops du jour
    var tb = null; Object.keys(D.bitsBy).forEach(function(n){ if (!tb || D.bitsBy[n] > tb.c) tb = { n: n, c: D.bitsBy[n] }; }); if (tb) D.topbits = tb;
    var tg = null; Object.keys(D.giftBy).forEach(function(n){ if (!tg || D.giftBy[n] > tg.c) tg = { n: n, c: D.giftBy[n] }; }); if (tg) D.topgift = tg;
    save(); render(changed);
  }
  function onMessage(m){
    if (m.cmd && m.isMod && m.cmd.name === 'derniers' && (m.cmd.args[0] || '').toLowerCase() === 'reset'){ SKO.store.del(key); load(); save(); render(); }
  }

  SKO.params(DEFAULTS, function(p){
    P = p;
    SKO.theme(P);
    var root = document.documentElement.style;
    root.setProperty('--fs', num(P.fs, 12, 72, 24) + 'px');
    root.setProperty('--justify', P.align === 'right' ? 'flex-end' : P.align === 'center' ? 'center' : 'flex-start');
    document.body.className = 'l-' + (/^(rotate|list|row)$/.test(P.layout) ? P.layout : 'rotate') + (P.icons === '1' ? '' : ' no-ico');
    var sk = P.demo === '1' ? 'demo' : SKT.cleanChannel(P.ch);
    var k = 'sk-last:' + sk;
    if (k !== key){ key = k; load();
      if (sk === 'demo' && !D.sub){ D.sub = { n: 'Lunaa_', m: 6 }; D.gift = { n: 'Mamie_Gameuse', c: 5 }; D.raid = { n: 'Choupette', c: 42 }; D.bits = { n: 'KevGaming', c: 500 }; D.topbits = { n: 'KevGaming', c: 1200 }; D.topgift = { n: 'Mamie_Gameuse', c: 10 }; D.follow = { n: 'Zoé_42' }; D.tip = { n: 'BaguetteMan', c: '5 €' }; }
    }
    render();
    if (sk !== sourceKey){
      sourceKey = sk;
      if (source) source.close();
      (window.__extra || []).forEach(function(x){ if (x) x.close(); }); window.__extra = [];
      if (sk !== 'demo'){ if (P.tk) window.__extra.push(SKT.eventsub(P.tk, { event: onEvent })); if (P.se) window.__extra.push(SKT.streamelements(P.se, { event: onEvent })); }
      var h = { status: function(s, ch){ SKO.tellParent(s, { channel: ch }); }, message: onMessage, event: onEvent };
      source = sk === 'demo' ? SKT.demo(h, { events: true, min: 1200, spread: 800 }) : SKT.connect(sk, h);
    }
  });
})();
</script>
</body>
</html>
