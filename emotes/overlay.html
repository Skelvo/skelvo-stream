<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Pluie d'emotes — Skelvo Stream</title>
<!--
  Les emotes envoyées dans le tchat apparaissent à l'écran (pluie, rebonds,
  bulles qui montent ou explosion). Gros jet d'emotes sur les raids et les
  abonnements, et commande !pluie pour les modos.
  Animation en requestAnimationFrame, éléments réutilisés : léger pour OBS.
-->
<style>
  html, body{ margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .e{ position: absolute; left: 0; top: 0; width: var(--size, 64px); height: auto; will-change: transform, opacity; pointer-events: none; user-select: none; }
</style>
</head>
<body>
<script src="../assets/overlay.js?v=4"></script>
<script src="../assets/twitch.js?v=6"></script>
<script>
(function(){
  'use strict';
  var DEFAULTS = { ch: '', mode: 'rain', size: '72', per: '5', max: '80', life: '7', raid: '1', subs: '1', who: 'all', cmd: SKO.tr('pluie'), emotes3: '1', demo: '0' };
  var num = SKO.num;
  var P = {}, source = null, sourceKey = '';
  var parts = [], pool = [];
  var FALLBACK = ['25', '425618', '30259', '64138', '9', '81274', '58127'].map(SKT.twitchEmoteUrl);

  function W(){ return window.innerWidth; } function H(){ return window.innerHeight; }

  function spawn(url, mode, ox, oy){
    if (parts.length >= num(P.max, 5, 400, 80)){ var old = parts.shift(); old.el.remove(); }
    var size = num(P.size, 16, 300, 72) * (0.75 + Math.random() * 0.5);
    var img = new Image(); img.className = 'e'; img.src = url; img.alt = ''; img.style.width = size + 'px';
    var p = { el: img, size: size, t: 0, life: num(P.life, 2, 30, 7) * (0.8 + Math.random() * 0.4), rot: 0, vr: (Math.random() - .5) * 4, mode: mode };
    var w = W(), h = H();
    if (mode === 'rain'){ p.x = Math.random() * (w - size); p.y = -size - Math.random() * 200; p.vx = (Math.random() - .5) * 60; p.vy = 120 + Math.random() * 160; p.g = 220; }
    else if (mode === 'bounce'){ p.x = Math.random() * (w - size); p.y = h; p.vx = (Math.random() - .5) * 700; p.vy = -(700 + Math.random() * 600); p.g = 1500; }
    else if (mode === 'rise'){ p.x = Math.random() * (w - size); p.y = h + 10; p.vx = 0; p.vy = -(110 + Math.random() * 120); p.g = 0; p.phase = Math.random() * 6; p.vr = 0; }
    else { // explode
      var a = Math.random() * Math.PI * 2, s = 400 + Math.random() * 700;
      p.x = (ox != null ? ox : w / 2) - size / 2; p.y = (oy != null ? oy : h / 2) - size / 2;
      p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s - 300; p.g = 900; p.vr = (Math.random() - .5) * 12;
    }
    document.body.appendChild(img);
    parts.push(p);
  }

  var last = performance.now();
  function frame(now){
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var w = W(), h = H();
    for (var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.t += dt;
      p.vy += p.g * dt;
      if (p.mode === 'rise'){ p.x += Math.sin(p.t * 2 + p.phase) * 40 * dt; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.mode === 'bounce'){
        if (p.x < 0){ p.x = 0; p.vx = -p.vx * .8; } if (p.x > w - p.size){ p.x = w - p.size; p.vx = -p.vx * .8; }
        if (p.y > h - p.size && p.vy > 0){ p.y = h - p.size; p.vy = -p.vy * .62; p.vx *= .9; }
      }
      var fade = Math.min(1, (p.life - p.t) / 0.8, p.t / 0.15);
      var gone = p.t > p.life || (p.mode === 'rain' && p.y > h + 50) || (p.mode === 'rise' && p.y < -p.size - 20);
      if (gone){ p.el.remove(); parts.splice(i, 1); continue; }
      p.el.style.opacity = Math.max(0, fade);
      p.el.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px) rotate(' + p.rot + 'rad)';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function remember(urls){ urls.forEach(function(u){ if (pool.indexOf(u) < 0){ pool.push(u); if (pool.length > 40) pool.shift(); } }); }
  function burst(n, mode){
    var src = pool.length ? pool : FALLBACK;
    var ox = W() / 2, oy = H() / 2;
    for (var i = 0; i < n; i++) (function(i){ setTimeout(function(){ spawn(src[Math.floor(Math.random() * src.length)], mode || P.mode, ox, oy); }, i * 25); })(i);
  }

  function onMessage(m){
    if (m.cmd && m.isMod && m.cmd.name === String(P.cmd || SKO.tr('pluie')).toLowerCase().replace(/^!/, '')){ burst(40); return; }
    if (P.who === 'subs' && !m.isSub && !m.isMod && !m.isVip) return;
    var urls = [];
    SKT.pieces(m.text, m.emotes, P.emotes3 === '1').forEach(function(x){ if (x.emote) urls.push(x.emote); });
    if (!urls.length) return;
    remember(urls);
    urls.slice(0, num(P.per, 1, 30, 5)).forEach(function(u, i){ setTimeout(function(){ spawn(u, P.mode); }, i * 90); });
  }
  function onEvent(e){
    if (e.type === 'raid' && P.raid === '1') burst(Math.min(120, 30 + e.count), 'explode');
    else if (P.subs === '1' && (e.type === 'sub' || e.type === 'resub' || (e.type === 'subgift' && !e.fromBomb))) burst(18);
    else if (P.subs === '1' && e.type === 'giftbomb') burst(Math.min(100, 10 * e.count), 'explode');
  }

  SKO.params(DEFAULTS, function(p){
    P = p;
    document.documentElement.style.setProperty('--size', num(P.size, 16, 300, 72) + 'px');
    if (P.emotes3 === '1') SKT.loadGlobalEmotes();
    var sk = P.demo === '1' ? 'demo' : SKT.cleanChannel(P.ch);
    if (sk !== sourceKey){
      sourceKey = sk;
      if (source) source.close();
      var h = { status: function(s, ch){ SKO.tellParent(s, { channel: ch }); }, room: function(id){ if (P.emotes3 === '1') SKT.loadChannelEmotes(id); }, message: onMessage, event: onEvent };
      source = sk === 'demo' ? SKT.demo(h, { events: true, min: 400, spread: 700 }) : SKT.connect(sk, h);
    }
  });
})();
</script>
</body>
</html>
