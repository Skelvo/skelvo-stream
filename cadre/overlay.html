<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Cadre caméra — Skelvo Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--
  Overlay "cadre caméra" à coller dans OBS (Source > Navigateur).
  Page volontairement transparente et autonome : aucun fichier partagé,
  tout est réglé par les paramètres de l'URL (fabriqués par index.html).
  Dans l'aperçu de l'éditeur, les réglages arrivent aussi par postMessage
  pour éviter de recharger la page à chaque mouvement de curseur.
-->
<style>
  @property --a{ syntax: '<angle>'; inherits: true; initial-value: 0deg; }

  html, body{ margin: 0; height: 100%; background: transparent; overflow: hidden; }

  #frame{
    position: fixed;
    inset: var(--pad);
    border-radius: var(--r);
  }
  body.circle #frame{
    inset: auto;
    top: 50%; left: 50%;
    width: calc(min(100vw, 100vh) - var(--pad) * 2);
    height: calc(min(100vw, 100vh) - var(--pad) * 2);
    transform: translate(-50%, -50%);
    border-radius: 50%;
  }

  .layer{ position: absolute; inset: 0; border-radius: inherit; }
  .layer.glow{ filter: blur(var(--glow)); opacity: var(--glow-op, .85); }
  body.no-glow .layer.glow{ display: none; }

  /* Anneau : un fond quelconque découpé en bordure par un masque */
  .ring{
    position: absolute; inset: 0; border-radius: inherit;
    padding: var(--w);
    background: var(--c1);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
  }

  /* ---------- Styles ---------- */
  .s-gradient .ring{ background: conic-gradient(from var(--a), var(--c1), var(--c2), var(--c3), var(--c1)); animation: spin var(--speed) linear infinite; }
  .s-rainbow  .ring{ background: conic-gradient(from var(--a), #ff3b3b, #ff9f1a, #ffe600, #3dff6e, #22d3ff, #5b6cff, #d14bff, #ff3b3b); animation: spin var(--speed) linear infinite; }
  .s-flow     .ring{ background: linear-gradient(115deg, var(--c1) 0%, var(--c2) 25%, var(--c3) 50%, var(--c2) 75%, var(--c1) 100%); background-size: 400% 400%; animation: flow var(--speed) ease-in-out infinite alternate; }
  .s-neon     .ring{ background: var(--c1); }
  .s-neon     .layer.glow{ animation: neon var(--speed) ease-in-out infinite; }
  .s-neon     .layer.main{ animation: flicker calc(var(--speed) * 3) linear infinite; }
  .s-pulse    .ring{ background: linear-gradient(135deg, var(--c1), var(--c2)); }
  .s-pulse    .layer{ animation: pulse var(--speed) ease-in-out infinite; }

  .s-thin .ring{ background: linear-gradient(135deg, var(--c1), var(--c2)); padding: max(1.5px, calc(var(--w) * .35)); }
  .s-thin .layer.glow{ opacity: .6; }
  .s-double .ring{ background: var(--c1); }
  .s-double .ring.inner{ inset: calc(var(--w) * 2.2); border-radius: max(0px, calc(var(--r) - var(--w) * 2.2)); background: var(--c2); padding: max(1px, calc(var(--w) * .45)); opacity: .85; }
  body.circle.s-double .ring.inner{ border-radius: 50%; }
  .s-glass .ring{ background: linear-gradient(145deg, rgba(255,255,255,.55), rgba(255,255,255,.12) 40%, rgba(255,255,255,.05) 60%, rgba(255,255,255,.35)); }
  .s-glass .layer.main::after{ content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.45); }
  .s-glass .layer.glow{ opacity: .35; }
  .custom{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
  @keyframes spin{ to{ --a: 360deg; } }
  @keyframes flow{ from{ background-position: 0% 50%; } to{ background-position: 100% 50%; } }
  @keyframes neon{ 0%,100%{ opacity: .95; } 50%{ opacity: .45; } }
  @keyframes flicker{ 0%,41%,43%,45%,100%{ opacity: 1; } 42%,44%{ opacity: .55; } }
  @keyframes pulse{ 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.012); } }

  /* Pointillés défilants (SVG) */
  .dash{ position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .dash rect{ fill: none; stroke-linecap: round; animation: march var(--speed) linear infinite; }
  @keyframes march{ to{ stroke-dashoffset: var(--period); } }

  /* Coins seulement */
  .corner{ position: absolute; width: var(--cl); height: var(--cl); border: 0 solid var(--c1); animation: breathe var(--speed) ease-in-out infinite; }
  .corner.tl{ top: 0; left: 0; border-top-width: var(--w); border-left-width: var(--w); border-top-left-radius: var(--r); --dx: -1; --dy: -1; }
  .corner.tr{ top: 0; right: 0; border-top-width: var(--w); border-right-width: var(--w); border-top-right-radius: var(--r); border-color: var(--c2); --dx: 1; --dy: -1; }
  .corner.br{ bottom: 0; right: 0; border-bottom-width: var(--w); border-right-width: var(--w); border-bottom-right-radius: var(--r); --dx: 1; --dy: 1; }
  .corner.bl{ bottom: 0; left: 0; border-bottom-width: var(--w); border-left-width: var(--w); border-bottom-left-radius: var(--r); border-color: var(--c2); --dx: -1; --dy: 1; }
  @keyframes breathe{ 0%,100%{ transform: translate(0, 0); } 50%{ transform: translate(calc(var(--dx) * var(--w) * .8), calc(var(--dy) * var(--w) * .8)); } }

  body.static *{ animation: none !important; }

  /* ---------- Étiquette (pseudo) ---------- */
  .label{
    position: absolute;
    z-index: 2;
    font: var(--lfw, 700) var(--ls)/1 var(--lfont, 'Space Grotesk'), system-ui, sans-serif;
    color: var(--lt);
    background: linear-gradient(135deg, var(--c1), var(--c2));
    padding: .42em .8em .46em;
    border-radius: .5em;
    white-space: nowrap;
    box-shadow: 0 .3em 1em rgba(0,0,0,.35);
    letter-spacing: .01em;
  }
  .label.ls-glass{ background: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.06)), rgba(15,14,22,.55); color: #fff; border: 1px solid rgba(255,255,255,.3); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .label.ls-dark{ background: rgba(10,10,14,.85); color: #fff; border: 1px solid rgba(255,255,255,.1); }
  .label.ls-dark::before{ content: ""; display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--c1); margin-right: .45em; vertical-align: .08em; box-shadow: 0 0 .5em var(--c1); }
  .label.ls-outline{ background: rgba(0,0,0,.35); color: #fff; border: .1em solid var(--c1); }
  .label.ls-text{ background: none; box-shadow: none; color: #fff; text-shadow: 0 .05em .3em rgba(0,0,0,.8); padding-left: .2em; padding-right: .2em; }
  .label.b{ bottom: 0; } .label.t{ top: 0; }
  .label.b{ transform: translateY(50%); } .label.t{ transform: translateY(-50%); }
  .label.l{ left: calc(var(--r) * .5 + var(--w) * 2 + 10px); }
  .label.r{ right: calc(var(--r) * .5 + var(--w) * 2 + 10px); }
  .label.c{ left: 50%; }
  .label.c.b{ transform: translate(-50%, 50%); } .label.c.t{ transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div id="frame"></div>

<script src="../assets/overlay.js?v=3"></script>
<script>
(function(){
  'use strict';

  var DEFAULTS = {
    shape: 'rect', style: 'gradient',
    c1: 'a78bfa', c2: '67e8f9', c3: 'f9a8d4',
    w: '8', r: '24', glow: '12', speed: '4',
    cl: '22', label: '', lpos: 'bl', ls: '22', lfont: 'grotesk', lstyle: 'fill', lup: '0', cimg: ''
  };

  var frame = document.getElementById('frame');
  var current = {}, lastStructure = '';

  function num(v, min, max, def){ v = parseFloat(v); if (isNaN(v)) v = def; return Math.min(max, Math.max(min, v)); }
  function hex(v, def){ return /^[0-9a-f]{6}$/i.test(v || '') ? '#' + v : '#' + def; }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }

  // Texte noir ou blanc selon la couleur de fond de l'étiquette
  function textOn(h){
    var n = parseInt(h.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#14121f' : '#ffffff';
  }

  function drawing(p){
    if (p.style === 'dash'){
      return '<svg class="dash"><defs><linearGradient id="g{ID}" x1="0" y1="0" x2="1" y2="1">' +
             '<stop offset="0" stop-color="' + p.c1 + '"/><stop offset=".5" stop-color="' + p.c2 + '"/><stop offset="1" stop-color="' + p.c3 + '"/>' +
             '</linearGradient></defs><rect stroke="url(#g{ID})"/></svg>';
    }
    if (p.style === 'image'){ return p.img ? '<img class="custom" src="' + esc(p.img) + '" alt="">' : ''; }
    if (p.style === 'double'){ return '<div class="ring"></div><div class="ring inner"></div>'; }
    if (p.style === 'corners'){
      return '<div class="corner tl"></div><div class="corner tr"></div><div class="corner br"></div><div class="corner bl"></div>';
    }
    return '<div class="ring"></div>';
  }

  // Le SVG a besoin de vraies dimensions en pixels
  function sizeSvg(){
    var w = num(current.w, 1, 60, 8);
    frame.querySelectorAll('.dash').forEach(function(svg){
      var box = frame.getBoundingClientRect();
      var rect = svg.querySelector('rect');
      var W = box.width, H = box.height;
      var rx = current.shape === 'circle' ? (W / 2) : Math.min(num(current.r, 0, 400, 24), W / 2, H / 2);
      rect.setAttribute('x', w / 2); rect.setAttribute('y', w / 2);
      rect.setAttribute('width', Math.max(0, W - w)); rect.setAttribute('height', Math.max(0, H - w));
      rect.setAttribute('rx', Math.max(0, rx - w / 2));
      rect.setAttribute('stroke-width', w);
      var dash = w * 2.6, gap = w * 2.2;
      rect.setAttribute('stroke-dasharray', dash + ' ' + gap);
      svg.style.setProperty('--period', -(dash + gap) * 4 + 'px');
    });
  }

  function render(raw){
    var p = Object.assign({}, DEFAULTS, raw || {});
    current = p;
    var c1 = hex(p.c1, DEFAULTS.c1), c2 = hex(p.c2, DEFAULTS.c2), c3 = hex(p.c3, DEFAULTS.c3);
    var w = num(p.w, 1, 60, 8), r = num(p.r, 0, 400, 24), glow = num(p.glow, 0, 80, 18);
    var speed = num(p.speed, 0, 30, 4), ls = num(p.ls, 10, 80, 22), cl = num(p.cl, 5, 50, 22);
    var style = /^(solid|neon|gradient|flow|rainbow|pulse|dash|corners|thin|double|glass|image)$/.test(p.style) ? p.style : 'gradient';
    var cimg = SKO.safeImage(p.cimg);
    if (cimg) style = 'image';
    var circle = p.shape === 'circle';
    var label = String(p.label || '').slice(0, 40);

    // Marge autour du cadre pour ne pas couper la lueur ni l'étiquette
    if (cimg) glow = 0;
    var pad = Math.ceil(Math.max(glow * 1.6, label ? ls * 0.9 : 0, 2));

    var root = document.documentElement.style;
    root.setProperty('--c1', c1); root.setProperty('--c2', c2); root.setProperty('--c3', c3);
    root.setProperty('--w', w + 'px'); root.setProperty('--r', r + 'px');
    root.setProperty('--glow', glow / 2 + 'px'); root.setProperty('--pad', pad + 'px');
    root.setProperty('--speed', (speed || 1) + 's');
    root.setProperty('--cl', cl + '%'); root.setProperty('--ls', ls + 'px');
    root.setProperty('--lt', textOn(c1));
    root.setProperty('--lfont', SKO.useFont(p.lfont));
    root.setProperty('--lfw', p.lfont === 'bebas' || p.lfont === 'anton' || p.lfont === 'press' || p.lfont === 'pixel' ? '400' : '700');

    document.body.className = [circle ? 'circle' : 'rect', 's-' + style, glow ? '' : 'no-glow', speed ? '' : 'static'].join(' ');

    var art = { c1: c1, c2: c2, c3: c3, style: style, img: cimg };
    var lst0 = /^(fill|glass|dark|outline|text)$/.test(p.lstyle) ? p.lstyle : 'fill';
    var structure = [style, circle, label, p.lpos, lst0, p.lup, cimg, style === 'dash' ? c1 + c2 + c3 : ''].join('|');
    if (structure === lastStructure){ sizeSvg(); return; } // un curseur a bougé : les variables CSS suffisent
    lastStructure = structure;
    var html = (style === 'image' ? '' : '<div class="layer glow">' + drawing(art).replace(/\{ID\}/g, 'a') + '</div>') +
               '<div class="layer main">' + drawing(art).replace(/\{ID\}/g, 'b') + '</div>';

    if (label){
      var pos = /^(tl|tc|tr|bl|bc|br)$/.test(p.lpos) ? p.lpos : 'bl';
      if (circle) pos = pos[0] + 'c'; // sur un rond, l'étiquette reste centrée
      var lst = /^(fill|glass|dark|outline|text)$/.test(p.lstyle) ? p.lstyle : 'fill';
      html += '<div class="label ls-' + lst + ' ' + pos[0] + ' ' + pos[1] + '"' + (p.lup === '1' ? ' style="text-transform:uppercase;letter-spacing:.06em"' : '') + '>' + esc(label) + '</div>';
    }
    frame.innerHTML = html;
    sizeSvg();
  }

  window.addEventListener('resize', sizeSvg);

  // Réglages depuis l'URL…
  var params = {};
  new URLSearchParams(location.search).forEach(function(v, k){ params[k] = v; });
  render(params);

  // …ou en direct depuis l'éditeur (aperçu)
  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || !e.data || e.data.type !== 'sk-params') return;
    render(e.data.params);
  });
})();
</script>
</body>
</html>
