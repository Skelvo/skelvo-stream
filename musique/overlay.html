<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Musique en cours — Skelvo Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  « En écoute » : titre, artiste et pochette de la musique en cours, lus sur
  Last.fm (qui se branche gratuitement sur Spotify, Deezer, YouTube Music,
  Apple Music…). On interroge l'API publique de Last.fm toutes les 12 secondes.
  Spotify n'ouvre plus son API aux petits outils gratuits depuis 2025.
-->
<link rel="stylesheet" href="../assets/overlay.css?v=3">
<style>
  :root{ --fs: 24px; }
  html, body{ margin: 0; height: 100%; overflow: hidden; }
  body{ font-size: var(--fs); display: flex; align-items: center; justify-content: var(--justify, flex-start); padding: 0 .4em; box-sizing: border-box; }
  .np{ display: flex; align-items: center; gap: .7em; max-width: 100%; padding: .45em 1em .45em .45em; transition: opacity .5s, transform .5s; }
  .np.hidden{ opacity: 0; transform: translateY(.5em); }
  .art{ flex: none; width: 2.9em; height: 2.9em; border-radius: calc(var(--rad) * .6); background: linear-gradient(135deg, var(--ac), var(--ac2)) center/cover; box-shadow: 0 .15em .5em rgba(0,0,0,.35); }
  .no-art .art{ display: none; } .no-art .np{ padding-left: 1em; }
  .info{ min-width: 0; overflow: hidden; }
  .head{ display: flex; align-items: center; gap: .45em; font-size: .5em; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ac); margin-bottom: .15em; }
  .sk-accent .head{ color: inherit; opacity: .85; }
  .eq{ display: inline-flex; gap: .14em; align-items: flex-end; height: .9em; }
  .eq i{ width: .2em; background: currentColor; border-radius: .1em; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2){ animation-delay: -.3s; } .eq i:nth-child(3){ animation-delay: -.6s; }
  @keyframes eq{ 0%,100%{ height: 25%; } 50%{ height: 100%; } }
  .paused .eq i{ animation: none; height: 25%; }
  .title, .artist{ white-space: nowrap; overflow: hidden; }
  .title{ font-weight: var(--fw); line-height: 1.25; }
  .artist{ font-size: .72em; color: var(--muted); font-weight: 500; }
  .sk-accent .artist{ color: inherit; opacity: .85; }
  .scroll span{ display: inline-block; padding-right: 2em; animation: marquee var(--mq, 10s) linear infinite; }
  @keyframes marquee{ to{ transform: translateX(-50%); } }

  .l-vinyl .np{ border-radius: 999px; }
  .l-vinyl .art{ border-radius: 50%; animation: spin 6s linear infinite; position: relative; }
  .l-vinyl .art::after{ content: ""; position: absolute; inset: 40%; border-radius: 50%; background: var(--sf-solid); box-shadow: 0 0 0 .1em rgba(255,255,255,.25); }
  .l-vinyl.paused .art{ animation-play-state: paused; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .l-big .np{ flex-direction: column; align-items: flex-start; padding: .6em; gap: .5em; }
  .l-big .art{ width: 6em; height: 6em; }
  .l-clean .np.sk-surface{ background: none; border: 0; box-shadow: none; text-shadow: 0 0 .08em #000, 0 .05em .15em #000; padding-left: 0; }

  .change .info{ animation: change .6s ease; }
  @keyframes change{ from{ opacity: 0; transform: translateX(.6em); } }
</style>
</head>
<body>
<div class="np sk-surface hidden" id="np">
  <div class="art" id="art"></div>
  <div class="info">
    <div class="head"><span class="eq"><i></i><i></i><i></i></span><span id="headtxt">En écoute</span></div>
    <div class="title" id="title"></div>
    <div class="artist" id="artist"></div>
  </div>
</div>

<script src="../assets/overlay.js?v=3"></script>
<script>
(function(){
  'use strict';
  // Clé API Last.fm de Skelvo Stream (gratuite). Si elle est vide, le streamer met la sienne dans l'éditeur.
  var DEFAULT_KEY = '';
  var DEFAULTS = Object.assign({}, SKO.THEME, { user: '', key: '', style: 'card', fs: '24', art: '1', hide: '1', head: 'En écoute', align: 'left', demo: '0' });
  var num = SKO.num;
  var np = document.getElementById('np'), artEl = document.getElementById('art'), titleEl = document.getElementById('title'), artistEl = document.getElementById('artist');
  var P = {}, timer = null, current = '', pollKey = '', last = null;

  function setText(node, text){
    node.textContent = '';
    var span = document.createElement('span'); span.textContent = text; node.appendChild(span);
    node.classList.remove('scroll');
    // Défilement si le texte est trop long pour la place disponible
    requestAnimationFrame(function(){
      if (span.offsetWidth > node.clientWidth + 2){
        var copy = document.createElement('span'); copy.textContent = text;
        node.appendChild(copy); node.classList.add('scroll');
        node.style.setProperty('--mq', Math.max(6, text.length * .35) + 's');
      }
    });
  }

  function show(track){
    last = track;
    if (!track){ if (P.hide === '1') np.classList.add('hidden'); document.body.classList.add('paused'); return; }
    document.body.classList.toggle('paused', !track.playing);
    if (!track.playing && P.hide === '1'){ np.classList.add('hidden'); return; }
    var id = track.title + '|' + track.artist;
    if (id !== current){
      current = id;
      setText(titleEl, track.title); setText(artistEl, track.artist);
      artEl.style.backgroundImage = track.img ? 'url("' + track.img.replace(/"/g, '') + '")' : '';
      np.classList.remove('change'); void np.offsetWidth; np.classList.add('change');
    }
    np.classList.remove('hidden');
  }

  function poll(){
    var user = String(P.user || '').trim(), key = String(P.key || DEFAULT_KEY).trim();
    if (!user || !key){ SKO.tellParent(user ? 'nokey' : 'nouser'); show(null); return; }
    var url = 'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&limit=1&format=json&user=' + encodeURIComponent(user) + '&api_key=' + encodeURIComponent(key);
    fetch(url).then(function(r){ return r.json(); }).then(function(d){
      if (d.error){ SKO.tellParent('lferror', { message: d.message }); show(null); return; }
      SKO.tellParent('connected', { channel: user });
      var t = d.recenttracks && d.recenttracks.track && d.recenttracks.track[0];
      if (!t){ show(null); return; }
      var img = (t.image || []).filter(function(i){ return i['#text']; }).pop();
      // Last.fm renvoie une image grise par défaut quand il n'a pas de pochette
      var src = img && !/2a96cbd8b46e442fc41c2b86b821562f/.test(img['#text']) ? img['#text'] : '';
      show({ title: t.name, artist: t.artist && (t.artist['#text'] || t.artist.name) || '', img: src, playing: !!(t['@attr'] && t['@attr'].nowplaying === 'true') });
    }).catch(function(){ SKO.tellParent('retry'); });
  }

  var DEMO = [
    { title: 'Nuit blanche sur la Côte', artist: 'Les Pixels Perdus' },
    { title: 'Respawn (Version longue qui ne tient pas dans la case)', artist: 'DJ Raclette' },
    { title: 'Boss final', artist: 'Synthwave Club' }
  ];
  var demoI = 0;

  SKO.params(DEFAULTS, function(p){
    P = p;
    SKO.theme(P);
    var root = document.documentElement.style;
    root.setProperty('--fs', num(P.fs, 12, 80, 24) + 'px');
    root.setProperty('--justify', P.align === 'right' ? 'flex-end' : P.align === 'center' ? 'center' : 'flex-start');
    var st = { card: 'card', vinyl: 'vinyl', big: 'big', clean: 'clean' }[P.style] || 'card';
    document.body.className = 'l-' + st + (P.art === '1' ? '' : ' no-art');
    document.getElementById('headtxt').textContent = P.head || '';
    document.querySelector('.head').style.display = P.head ? '' : 'none';
    var k = P.demo === '1' ? 'demo' : P.user + '|' + P.key;
    if (k !== pollKey){
      pollKey = k; clearInterval(timer); current = '';
      if (P.demo === '1'){
        SKO.tellParent('demo');
        var d = function(){ var t = DEMO[demoI++ % DEMO.length]; show({ title: t.title, artist: t.artist, img: '', playing: true }); };
        d(); timer = setInterval(d, 6000);
      } else { poll(); timer = setInterval(poll, 12000); }
    } else { current = ''; show(last); }
  });
})();
</script>
</body>
</html>
