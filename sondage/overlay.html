<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Sondage — Skelvo Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Sondage par le tchat. Le streamer ou un modo lance :
    !sondage Quel jeu après ? | Minecraft | Elden Ring | Fortnite
    !sondage On continue ?          (sans choix : Oui / Non)
  Les viewers votent en tapant 1, 2, 3… (un vote par personne, modifiable).
    !sondage fin    termine et affiche le gagnant
    !sondage stop   masque le sondage
  Invisible quand aucun sondage n'est en cours. Mémorisé si OBS redémarre.
-->
<link rel="stylesheet" href="../assets/overlay.css?v=4">
<style>
  :root{ --fs: 24px; }
  html, body{ margin: 0; height: 100%; overflow: hidden; }
  body{ font-size: var(--fs); display: flex; align-items: flex-start; padding: .5em; box-sizing: border-box; }

  .poll{ width: 100%; transition: opacity .5s, transform .5s cubic-bezier(.2,.9,.3,1.2); padding: .85em .95em .95em; }
  .poll.hidden{ opacity: 0; transform: translateY(-.8em) scale(.97); }
  .l-clean .poll.sk-surface{ background: none; border: 0; box-shadow: none; padding: 0; text-shadow: 0 0 .1em #000, 0 .05em .15em #000; }

  .q{ font-weight: var(--fw); text-transform: var(--up); letter-spacing: var(--ls); font-size: 1.1em; line-height: 1.2; margin-bottom: .25em; }
  .sub{ font-size: .6em; color: var(--muted); margin-bottom: .75em; display: flex; justify-content: space-between; gap: 1em; font-weight: 600; letter-spacing: .02em; }
  .opt{ position: relative; margin-top: .42em; border-radius: calc(var(--rad) * .7); overflow: hidden; background: rgba(127,127,127,.16); }
  .opt .bar{ position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--ac), var(--ac2)); opacity: .55; transition: width .8s cubic-bezier(.2,.9,.2,1); }
  .opt .row{ position: relative; display: flex; align-items: center; gap: .6em; padding: .38em .6em; }
  .opt .n{ flex: none; width: 1.45em; height: 1.45em; border-radius: calc(var(--rad) * .5); background: var(--ac); color: var(--ac-tx); display: grid; place-items: center; font-weight: 800; font-size: .78em; }
  .opt .label{ flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt .pc{ font-weight: 800; font-variant-numeric: tabular-nums; }
  .l-compact .poll{ padding: .6em .7em .7em; }
  .l-compact .opt{ margin-top: .28em; } .l-compact .opt .row{ padding: .22em .5em; } .l-compact .q{ font-size: .95em; }
  .ended .opt.win .bar{ background: linear-gradient(90deg, #f5c451, #ffe08a); opacity: .85; }
  .ended .opt.win .n{ background: #f5c451; color: #241a00; }
  .ended .opt:not(.win){ opacity: .5; }
  .ended .opt.win .label::after{ content: " 🏆"; }
</style>
</head>
<body>
<div class="poll sk-surface hidden" id="poll"></div>

<script src="../assets/overlay.js?v=5"></script>
<script src="../assets/twitch.js?v=6"></script>
<script>
(function(){
  'use strict';
  var DEFAULTS = Object.assign({}, SKO.THEME, { ch: '', dur: '120', hide: '20', cmd: SKO.tr('sondage'), style: 'card', fs: '24', demo: '0' });
  var num = SKO.num, el = SKO.el;
  var box = document.getElementById('poll');
  var P = {}, poll = null, key = '', source = null, sourceKey = '', hideTimer = null;

  function save(){ SKO.store.set(key, poll); }

  function start(question, options){
    if (options.length < 2) options = [SKO.tr('Oui'), SKO.tr('Non')];
    var dur = num(P.dur, 0, 3600, 120);
    poll = { q: question, opts: options.slice(0, 9), votes: {}, end: dur ? Date.now() + dur * 1000 : 0, ended: false, endedAt: 0 };
    save(); render(true);
  }
  function finish(){
    if (!poll || poll.ended) return;
    poll.ended = true; poll.endedAt = Date.now(); save(); render(false);
  }
  function hide(){ poll = null; SKO.store.del(key); render(false); }

  function counts(){
    var c = poll.opts.map(function(){ return 0; });
    Object.keys(poll.votes).forEach(function(u){ var v = poll.votes[u]; if (c[v] != null) c[v]++; });
    return c;
  }

  function render(rebuild){
    clearTimeout(hideTimer);
    if (!poll){ box.classList.add('hidden'); return; }
    var c = counts(), total = c.reduce(function(a, b){ return a + b; }, 0), best = Math.max.apply(null, c);
    if (rebuild || !box.querySelector('.opt')){
      box.textContent = '';
      box.appendChild(el('div', 'q', poll.q));
      var sub = el('div', 'sub'); sub.appendChild(el('span', 'how')); sub.appendChild(el('span', 'left')); box.appendChild(sub);
      poll.opts.forEach(function(o, i){
        var d = el('div', 'opt'); d.appendChild(el('div', 'bar'));
        var r = el('div', 'row'); r.appendChild(el('span', 'n', String(i + 1))); r.appendChild(el('span', 'label', o)); r.appendChild(el('span', 'pc', '0 %'));
        d.appendChild(r); box.appendChild(d);
      });
    }
    box.classList.toggle('ended', poll.ended);
    box.querySelector('.how').textContent = poll.ended ? SKO.tr('Résultats · ') + total + ' vote' + (total > 1 ? 's' : '') : SKO.tr('Tape le numéro dans le tchat · ') + total + ' vote' + (total > 1 ? 's' : '');
    box.querySelectorAll('.opt').forEach(function(d, i){
      var pc = total ? Math.round(c[i] / total * 100) : 0;
      d.querySelector('.bar').style.width = pc + '%';
      d.querySelector('.pc').textContent = pc + (SKO.lang === 'en' ? '%' : ' %');
      d.classList.toggle('win', poll.ended && total > 0 && c[i] === best);
    });
    tick();
    box.classList.remove('hidden');
    if (poll.ended){
      var h = num(P.hide, 0, 3600, 20);
      if (h) hideTimer = setTimeout(hide, Math.max(0, poll.endedAt + h * 1000 - Date.now()));
    }
  }
  function tick(){
    if (!poll) return;
    var left = box.querySelector('.left'); if (!left) return;
    if (!poll.ended && poll.end && Date.now() >= poll.end){ finish(); return; }
    left.textContent = poll.ended ? SKO.tr('Terminé') : poll.end ? SKO.clock((poll.end - Date.now()) / 1000) : '';
  }
  setInterval(tick, 500);

  function onMessage(m){
    var name = String(P.cmd || SKO.tr('sondage')).toLowerCase().replace(/^!/, '');
    if (m.cmd && m.cmd.name === name){
      if (!m.isMod) return;
      var rest = m.cmd.rest, low = rest.toLowerCase();
      if (low === 'fin' || low === 'end' || low === 'resultats' || low === 'résultats') return finish();
      if (low === 'stop' || low === 'cacher' || low === 'annule' || low === 'cancel') return hide();
      if (!rest) return;
      var bits = rest.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
      return start(bits.shift().slice(0, 120), bits.map(function(s){ return s.slice(0, 60); }));
    }
    if (!poll || poll.ended) return;
    var t = m.text.trim().replace(/^!vote\s*/i, '');
    if (!/^\d$/.test(t)) return;
    var i = parseInt(t, 10) - 1;
    if (i < 0 || i >= poll.opts.length) return;
    poll.votes[m.login] = i; save(); render(false);
  }

  SKO.params(DEFAULTS, function(p){
    P = p;
    SKO.theme(P);
    document.documentElement.style.setProperty('--fs', num(P.fs, 12, 72, 24) + 'px');
    document.body.className = 'l-' + ({ card: 'card', neon: 'card', compact: 'compact', clean: 'clean' }[P.style] || 'card');

    var sk = P.demo === '1' ? 'demo' : SKT.cleanChannel(P.ch);
    var k = 'sk-poll:' + sk;
    if (k !== key){ key = k; poll = SKO.store.get(key); if (poll && poll.ended && Date.now() - poll.endedAt > num(P.hide, 0, 3600, 20) * 1000 && num(P.hide, 0, 3600, 20)) poll = null; }
    render(true);

    if (sk !== sourceKey){
      sourceKey = sk;
      if (source) source.close();
      var h = { status: function(s, ch){ SKO.tellParent(s, { channel: ch }); }, message: onMessage };
      if (sk === 'demo'){
        start(SKO.tr('Quel jeu après ce live ?'), ['Minecraft', 'Elden Ring', 'Fortnite']);
        var voters = 0;
        source = SKT.demo(h, { min: 250, spread: 400, extra: function(){
          voters++;
          if (voters > 60){ voters = 0; start(SKO.tr('Quel jeu après ce live ?'), ['Minecraft', 'Elden Ring', 'Fortnite']); return null; }
          var r = Math.random(), v = r < .5 ? '2' : r < .8 ? '1' : '3';
          return SKT.fakeMessage({ n: 'viewer' + voters, c: '', b: '' }, v);
        } });
      } else source = SKT.connect(sk, h);
    }
  });
})();
</script>
</body>
</html>
