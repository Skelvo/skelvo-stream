<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Sous-titres — Skelvo Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Affiche les sous-titres envoyés par la page « micro » (sous-titres/index.html)
  ouverte dans Chrome. Liaison directe navigateur → OBS avec PeerJS (WebRTC) :
  la page micro s'enregistre sous l'identifiant "skelvo-st-<code>", cet overlay
  s'y connecte et réessaie tout seul s'il la perd.
  Dans l'aperçu de l'éditeur (preview=1), les textes arrivent par postMessage.
-->
<style>
  :root{ --fs: 40px; --font: 'Space Grotesk', system-ui, sans-serif; --tx: #fff; --bg: rgba(0,0,0,.65); --ac: #4be1c3; }
  html, body{ margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body{ font-family: var(--font); font-size: var(--fs); color: var(--tx); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: .4em; box-sizing: border-box; }
  body.top{ justify-content: flex-start; }
  #box{ max-width: 100%; text-align: center; transition: opacity .6s; }
  #box.hidden{ opacity: 0; }
  .line{ display: inline; line-height: 1.45; font-weight: 700; padding: .08em .35em; -webkit-box-decoration-break: clone; box-decoration-break: clone; background: var(--bg); border-radius: .2em; }
  .s-outline .line{ background: none; text-shadow: 0 0 .06em #000, 0 0 .1em #000, .04em .04em .1em #000, -.04em -.04em .1em #000; }
  .row{ margin-top: .2em; }
  .row.tr .line{ color: var(--ac); }
  .interim{ opacity: .7; }
</style>
</head>
<body>
<div id="box" class="hidden"></div>

<script src="../assets/overlay.js?v=2"></script>
<script src="../assets/vendor/peerjs-1.5.4.min.js"></script>
<script>
(function(){
  'use strict';
  var DEFAULTS = { room: '', show: 'orig', lines: '2', fade: '6', style: 'box', pos: 'bottom', fs: '40', font: 'grotesk', tx: 'ffffff', ac: '4be1c3', bgo: '65', preview: '0' };
  var num = SKO.num, el = SKO.el;
  var box = document.getElementById('box');
  var P = {}, finals = [], interim = '', fadeTimer = null, peer = null, conn = null, room = '';

  function render(){
    box.textContent = '';
    var max = num(P.lines, 1, 6, 2);
    var items = finals.slice(-max);
    var showOrig = P.show !== 'trans', showTr = P.show !== 'orig';
    items.forEach(function(f){
      if (showOrig || !f.tr){ var r = el('div', 'row'); r.appendChild(el('span', 'line', f.text)); box.appendChild(r); }
      if (showTr && f.tr){ var t = el('div', 'row tr'); t.appendChild(el('span', 'line', f.tr)); box.appendChild(t); }
    });
    if (interim && showOrig){ var i = el('div', 'row interim'); i.appendChild(el('span', 'line', interim)); box.appendChild(i); }
    box.classList.toggle('hidden', !box.childNodes.length);
    clearTimeout(fadeTimer);
    var fade = num(P.fade, 0, 120, 6);
    if (fade) fadeTimer = setTimeout(function(){ finals = []; interim = ''; box.classList.add('hidden'); }, fade * 1000);
  }

  function receive(d){
    if (!d || typeof d !== 'object') return;
    if (d.t === 'interim'){ interim = String(d.text || '').slice(0, 300); render(); }
    else if (d.t === 'final'){
      interim = '';
      finals.push({ text: String(d.text || '').slice(0, 300), tr: d.tr ? String(d.tr).slice(0, 300) : '' });
      if (finals.length > 12) finals.shift();
      render();
    } else if (d.t === 'clear'){ finals = []; interim = ''; render(); }
  }

  /* ---------- Liaison avec la page micro ---------- */
  var retryTimer = null;
  function connectPeer(){
    clearTimeout(retryTimer);
    if (!room || P.preview === '1' || !window.Peer) return;
    if (!peer || peer.destroyed){
      peer = new Peer({ debug: 0 });
      peer.on('open', dial);
      peer.on('disconnected', function(){ try { peer.reconnect(); } catch(e){} });
      peer.on('error', function(){ retryTimer = setTimeout(dial, 3000); });
    } else if (peer.open) dial();
  }
  function dial(){
    clearTimeout(retryTimer);
    if (!peer || !peer.open || (conn && conn.open)) return;
    var c = conn = peer.connect('skelvo-st-' + room, { reliable: true });
    function lost(){ if (c !== conn) return; conn = null; clearTimeout(retryTimer); retryTimer = setTimeout(dial, 2500); }
    c.on('data', receive);
    c.on('close', lost);
    c.on('error', lost);
    // Si la page micro n'est pas encore ouverte, la connexion ne s'ouvre jamais : on réessaie
    setTimeout(function(){ if (c === conn && !c.open){ try { c.close(); } catch(e){} lost(); } }, 5000);
  }

  window.addEventListener('message', function(e){
    if (e.origin === location.origin && e.data && e.data.type === 'sk-caption') receive(e.data.data);
  });

  SKO.params(DEFAULTS, function(p){
    P = p;
    var root = document.documentElement.style;
    root.setProperty('--font', SKO.useFont(P.font));
    root.setProperty('--fs', num(P.fs, 14, 120, 40) + 'px');
    root.setProperty('--tx', SKO.hex(P.tx, DEFAULTS.tx));
    root.setProperty('--ac', SKO.hex(P.ac, DEFAULTS.ac));
    root.setProperty('--bg', 'rgba(0,0,0,' + num(P.bgo, 0, 100, 65) / 100 + ')');
    document.body.className = 's-' + (P.style === 'outline' ? 'outline' : 'box') + (P.pos === 'top' ? ' top' : '');
    render();
    var r = String(P.room || '').replace(/[^a-z0-9]/gi, '').slice(0, 24);
    if (r !== room){ room = r; if (conn){ try { conn.close(); } catch(e){} conn = null; } connectPeer(); }
  });
})();
</script>
</body>
</html>
