<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Minuteur subathon — Skelvo Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Minuteur de subathon : chaque abonnement, sub offert ou bit ajoute du temps.
  Commandes (streamer et modos) :  !timer start | pause | +10m | -5m | set 2h
  L'état est mémorisé dans OBS (localStorage) : rien n'est perdu si OBS redémarre,
  et le temps continue de s'écouler pendant qu'OBS est fermé (fin = date précise).
-->
<link rel="stylesheet" href="../assets/overlay.css?v=3">
<style>
  :root{ --fs: 72px; }
  html, body{ margin: 0; height: 100%; overflow: hidden; }
  body{ display: flex; align-items: center; justify-content: center; font-size: var(--fs); }

  .box{ position: relative; display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
  .label{ font-size: .26em; font-weight: var(--fw); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: .35em; }
  .time{ font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .state{ font-size: .2em; margin-top: .5em; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ac); min-height: 1em; }
  .t-accent .time{ color: var(--ac); text-shadow: var(--glow-text); }
  .sk-accent .t-accent .time{ color: inherit; text-shadow: none; }

  .l-card .box{ padding: .32em .6em .3em; }
  .l-pill .box{ flex-direction: row; gap: .35em; padding: .18em .55em .22em; border-radius: max(var(--rad), .3em); }
  .l-pill .label{ margin: 0; font-size: .3em; } .l-pill .state{ display: none; }
  .l-clean .box.sk-surface{ background: none; border: 0; box-shadow: none; text-shadow: 0 .04em .2em rgba(0,0,0,.7); }
  .l-shine .box.sk-surface{ background: none; border: 0; box-shadow: none; }
  .l-shine .time{ background: linear-gradient(90deg, var(--ac), var(--tx), var(--ac2), var(--ac)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: shine 6s linear infinite; filter: drop-shadow(0 .03em .08em rgba(0,0,0,.55)); }
  @keyframes shine{ to{ background-position: -300% 0; } }
  .bar{ display: none; width: 100%; height: .07em; border-radius: 1em; background: rgba(255,255,255,.12); margin-top: .3em; overflow: hidden; }
  .bar i{ display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ac), var(--ac2)); transition: width 1s linear; }
  .with-bar .bar{ display: block; }

  .paused .time{ opacity: .55; }
  .low .time{ color: #ff5c6c !important; -webkit-text-fill-color: #ff5c6c; animation: blink 1s steps(2) infinite; }
  @keyframes blink{ 50%{ opacity: .55; } }

  .add{ position: absolute; left: 50%; top: 0; font-size: .34em; font-weight: 800; color: var(--ac); white-space: nowrap; text-shadow: 0 0 .25em rgba(0,0,0,.8); animation: add 2.2s ease-out forwards; pointer-events: none; }
  .add small{ display: block; font-size: .55em; font-weight: 600; color: var(--tx); text-align: center; }
  .add.neg{ color: #ff5c6c; }
  @keyframes add{ 0%{ opacity: 0; transform: translate(-50%, .4em) scale(.7); } 15%{ opacity: 1; transform: translate(-50%, -.7em) scale(1.05); } 75%{ opacity: 1; transform: translate(-50%, -1.2em); } 100%{ opacity: 0; transform: translate(-50%, -1.7em); } }
</style>
</head>
<body>
<div class="box sk-surface" id="box"><div class="label" id="label"></div><div class="time" id="time">0:00</div><div class="bar"><i id="bar"></i></div><div class="state" id="state"></div></div>

<script src="../assets/overlay.js?v=3"></script>
<script src="../assets/twitch.js?v=3"></script>
<script>
(function(){
  'use strict';
  var DEFAULTS = Object.assign({}, SKO.THEME, {
    ch: '', start: '120', t1: '5', t2: '10', t3: '20', gift: '5', bits: '1', raid: '0', max: '0',
    label: 'Subathon', cmd: 'timer', endtext: 'Terminé !', style: 'card', tc: 'text', showbar: '0', fs: '72', demo: '0'
  });
  var num = SKO.num;
  var timeEl = document.getElementById('time'), stateEl = document.getElementById('state'), labelEl = document.getElementById('label'), box = document.getElementById('box');
  var P = {}, S = null, key = '', source = null, sourceKey = '';

  // État : { running, end (ms, si en cours), left (s, si en pause) }
  function remaining(){ return S.running ? Math.max(0, (S.end - Date.now()) / 1000) : S.left; }
  function save(){ SKO.store.set(key, S); }
  function load(){
    var startSec = num(P.start, 0, 100000, 120) * 60;
    S = SKO.store.get(key);
    if (!S || typeof S.left !== 'number'){ S = { running: P.demo === '1', end: Date.now() + startSec * 1000, left: startSec }; save(); }
  }
  function setLeft(sec){
    var cap = num(P.max, 0, 100000, 0) * 60;
    sec = Math.max(0, cap ? Math.min(sec, cap) : sec);
    if (S.running) S.end = Date.now() + sec * 1000; else S.left = sec;
    save(); draw();
  }

  function add(sec, why){
    if (!sec) return;
    var before = remaining();
    setLeft(before + sec);
    var real = Math.round(remaining() - before);
    if (!real) return;
    var a = SKO.el('div', 'add' + (real < 0 ? ' neg' : ''), (real > 0 ? '+' : '−') + SKO.clock(Math.abs(real)));
    if (why) a.appendChild(SKO.el('small', '', why));
    box.appendChild(a); setTimeout(function(){ a.remove(); }, 2300);
  }

  function draw(){
    var left = remaining();
    document.body.classList.toggle('paused', !S.running && left > 0);
    document.body.classList.toggle('low', S.running && left > 0 && left <= 60);
    if (left <= 0 && S.running){ S.running = false; S.left = 0; save(); }
    timeEl.textContent = left <= 0 ? (P.endtext || '0:00') : SKO.clock(left);
    var ref = num(P.max, 0, 100000, 0) * 60 || Math.max(num(P.start, 0, 100000, 120) * 60, left);
    document.getElementById('bar').style.width = Math.min(100, left / ref * 100) + '%';
    stateEl.textContent = (!S.running && left > 0) ? 'En pause' : '';
  }
  setInterval(function(){ if (S) draw(); }, 250);

  function onEvent(e){
    var m = 60, sec = 0, why = '';
    if (e.type === 'sub' || e.type === 'resub'){
      sec = num(e.tier === 3 ? P.t3 : e.tier === 2 ? P.t2 : P.t1, 0, 600, 5) * m; why = e.name;
    } else if (e.type === 'subgift'){
      sec = num(P.gift, 0, 600, 5) * m; why = e.fromBomb ? '' : e.name + ' → ' + e.recipient;
    } else if (e.type === 'giftbomb'){
      // le temps arrive avec chaque subgift : on affiche juste le total d'un coup
      var t = num(P.gift, 0, 600, 5) * m * e.count;
      if (t){ var a = SKO.el('div', 'add', '+' + SKO.clock(Math.min(t, 360000))); a.appendChild(SKO.el('small', '', e.name + ' × ' + e.count)); box.appendChild(a); setTimeout(function(){ a.remove(); }, 2300); }
      return;
    } else if (e.type === 'bits'){
      sec = num(P.bits, 0, 600, 1) * m * e.amount / 100; why = e.name + ' · ' + e.amount + ' bits';
    } else if (e.type === 'raid'){
      sec = num(P.raid, 0, 60, 0) * e.count; why = 'Raid ' + e.name;
    }
    if (e.type === 'subgift' && e.fromBomb){ setLeft(remaining() + sec); return; }
    add(sec, why);
  }

  function onMessage(msg){
    if (!msg.cmd || !msg.isMod) return;
    if (msg.cmd.name !== String(P.cmd || 'timer').toLowerCase().replace(/^!/, '')) return;
    var a = (msg.cmd.args[0] || '').toLowerCase(), rest = msg.cmd.args.slice(1).join('');
    if (a === 'start' || a === 'play' || a === 'go' || a === 'reprendre'){
      if (!S.running && S.left > 0){ S.running = true; S.end = Date.now() + S.left * 1000; save(); draw(); }
    } else if (a === 'pause' || a === 'stop'){
      if (S.running){ S.left = remaining(); S.running = false; save(); draw(); }
    } else if (a === 'set' || a === 'reset'){
      var v = a === 'reset' ? num(P.start, 0, 100000, 120) * 60 : SKO.parseDuration(rest);
      if (!isNaN(v)) setLeft(v);
    } else if (/^[+-]/.test(a)){
      var d = SKO.parseDuration(a.slice(1) + rest);
      if (!isNaN(d)) add(a[0] === '-' ? -d : d, msg.name);
    }
  }

  SKO.params(DEFAULTS, function(p){
    var prevStart = P.start;
    P = p;
    SKO.theme(P);
    document.documentElement.style.setProperty('--fs', num(P.fs, 20, 220, 72) + 'px');
    var st = { card: 'card', neon: 'card', pill: 'pill', clean: 'clean', gradient: 'shine', shine: 'shine' }[P.style] || 'card';
    document.body.className = 'l-' + st + (P.tc === 'accent' ? ' t-accent' : '') + (P.showbar === '1' ? ' with-bar' : '');
    labelEl.textContent = P.label || '';
    labelEl.style.display = P.label ? '' : 'none';

    var sk = P.demo === '1' ? 'demo' : SKT.cleanChannel(P.ch);
    var k = 'sk-timer:' + sk;
    if (k !== key){ key = k; load(); }
    // Dans l'éditeur : la durée de départ modifiée remet le minuteur de démo à zéro
    if (P.demo === '1' && prevStart && prevStart !== P.start){ S = null; SKO.store.del(key); load(); }
    draw();

    if (sk !== sourceKey){
      sourceKey = sk;
      if (source) source.close();
      var h = { status: function(s, ch){ SKO.tellParent(s, { channel: ch }); }, message: onMessage, event: onEvent };
      source = sk === 'demo' ? SKT.demo(h, { events: true, min: 700, spread: 600 }) : SKT.connect(sk, h);
    }
  });
})();
</script>
</body>
</html>
