<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Compteur — Skelvo Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Compteur piloté par le tchat (morts, victoires…). Commandes, pour les modos
  et le streamer (ou tout le monde si choisi) :
    !mort+   !mort+ 3   !mort-   !mort= 12
  La valeur est mémorisée dans OBS (localStorage) : elle survit aux redémarrages.
-->
<link rel="stylesheet" href="../assets/overlay.css?v=4">
<style>
  :root{ --fs: 64px; }
  html, body{ margin: 0; height: 100%; overflow: hidden; }
  body{ display: flex; align-items: center; justify-content: var(--justify, center); font-size: var(--fs); padding: 0 .3em; box-sizing: border-box; }

  .counter{ position: relative; display: inline-flex; align-items: center; gap: .32em; line-height: 1; white-space: nowrap; }
  .icon{ font-size: .82em; display: inline-flex; }
  .icon img{ height: 1.05em; width: auto; display: block; }
  .label{ font-size: .46em; font-weight: var(--fw); text-transform: var(--up); letter-spacing: var(--ls); color: var(--muted); }
  .value{ font-weight: 800; font-variant-numeric: tabular-nums; display: inline-block; letter-spacing: -.01em; }
  .v-accent .value{ color: var(--ac); text-shadow: var(--glow-text); }
  .sk-accent .v-accent .value{ color: inherit; text-shadow: none; }

  /* Mises en page */
  .l-pill .counter{ padding: .2em .55em .24em .42em; border-radius: max(var(--rad), .4em); }
  .l-card .counter{ flex-direction: column; gap: .12em; padding: .32em .7em .4em; }
  .l-card .value{ font-size: 1.35em; }
  .l-card .top{ display: inline-flex; gap: .3em; align-items: center; }
  .l-split .counter{ gap: 0; padding: 0; overflow: hidden; }
  .l-split .left{ display: inline-flex; align-items: center; gap: .3em; padding: .24em .5em .26em .45em; }
  .l-split .value{ align-self: stretch; display: grid; place-items: center; padding: .24em .5em .26em; background: linear-gradient(135deg, var(--ac), var(--ac2)); color: var(--ac-tx); text-shadow: none; }
  .l-big .counter{ flex-direction: column; gap: .02em; }
  .l-big .counter.sk-surface{ background: none; border: 0; box-shadow: none; text-shadow: 0 .04em .2em rgba(0,0,0,.6); }
  .l-big .value{ font-size: 1.7em; }
  .l-big .top{ display: inline-flex; gap: .3em; align-items: center; }
  .l-clean .counter.sk-surface{ background: none; border: 0; box-shadow: none; text-shadow: 0 0 .06em #000, 0 0 .1em #000, .03em .03em .08em #000; }

  .bump{ animation: bump .5s cubic-bezier(.2,1.5,.4,1); }
  .down{ animation: down .45s ease; }
  @keyframes bump{ 0%{ transform: scale(1); } 35%{ transform: scale(1.28); } 100%{ transform: scale(1); } }
  @keyframes down{ 40%{ transform: translateY(.1em); opacity: .5; } }
  .float{ position: absolute; right: -.25em; top: -.2em; font-size: .42em; font-weight: 800; color: var(--ac); animation: float 1.1s ease-out forwards; pointer-events: none; text-shadow: 0 0 .2em rgba(0,0,0,.6); }
  @keyframes float{ from{ opacity: 1; transform: translateY(0); } to{ opacity: 0; transform: translateY(-1.3em); } }
</style>
</head>
<body>
<div class="counter sk-surface" id="counter"></div>

<script src="../assets/overlay.js?v=5"></script>
<script src="../assets/twitch.js?v=6"></script>
<script>
(function(){
  'use strict';
  var DEFAULTS = Object.assign({}, SKO.THEME, {
    ch: '', name: SKO.tr('mort'), label: SKO.tr('Morts'), icon: '💀', img: '', start: '0', who: 'mods',
    style: 'pill', vc: 'accent', fs: '64', align: 'center', demo: '0'
  });
  var num = SKO.num, el = SKO.el;
  var box = document.getElementById('counter');
  var P = {}, value = 0, key = '', source = null, sourceKey = '';
  var valueEl;
  var lastAll = {}; // anti-spam quand tout le monde peut modifier

  function storageKey(){ return 'sk-count:' + (P.demo === '1' ? 'demo' : SKT.cleanChannel(P.ch)) + ':' + cmdName(); }
  function cmdName(){ return String(P.name || SKO.tr('mort')).toLowerCase().replace(/^!/, '').replace(/[^a-z0-9éèàùç_]/g, '') || SKO.tr('mort'); }

  function build(){
    box.textContent = '';
    var icon = null, img = SKO.safeImage(P.img);
    if (img){ icon = el('span', 'icon'); var im = new Image(); im.src = img; im.alt = ''; icon.appendChild(im); }
    else if (P.icon) icon = el('span', 'icon', P.icon);
    var label = P.label ? el('span', 'label', P.label) : null;
    valueEl = el('span', 'value', String(value));
    if (P.style === 'card' || P.style === 'big'){
      var top = el('span', 'top'); if (icon) top.appendChild(icon); if (label) top.appendChild(label);
      if (top.childNodes.length) box.appendChild(top);
      box.appendChild(valueEl);
    } else if (P.style === 'split'){
      var left = el('span', 'left'); if (icon) left.appendChild(icon); if (label) left.appendChild(label);
      if (left.childNodes.length) box.appendChild(left);
      box.appendChild(valueEl);
    } else {
      if (icon) box.appendChild(icon);
      if (label) box.appendChild(label);
      box.appendChild(valueEl);
    }
  }

  function setValue(v, delta){
    v = Math.max(-999999, Math.min(999999, Math.round(v)));
    if (v === value && !delta) return;
    var up = v > value;
    value = v;
    SKO.store.set(key, value);
    valueEl.textContent = String(value);
    valueEl.classList.remove('bump', 'down'); void valueEl.offsetWidth;
    valueEl.classList.add(up ? 'bump' : 'down');
    if (delta){
      var f = el('span', 'float', (delta > 0 ? '+' : '') + delta);
      box.appendChild(f); setTimeout(function(){ f.remove(); }, 1200);
    }
  }

  function allowed(m){
    if (P.who === 'all'){
      if (m.isMod) return true;
      var now = Date.now();
      if (lastAll[m.login] && now - lastAll[m.login] < 10000) return false; // 1 commande / 10 s par viewer
      lastAll[m.login] = now; return true;
    }
    if (P.who === 'broadcaster') return m.isBroadcaster;
    return m.isMod;
  }

  function onMessage(m){
    if (!m.cmd) return;
    var n = cmdName(), c = m.cmd.name, arg = parseInt(m.cmd.args[0], 10);
    if (c !== n + '+' && c !== n + '-' && c !== n + '=') return;
    if (!allowed(m)) return;
    if (c === n + '='){ if (!isNaN(arg) && (m.isMod || P.who !== 'all')) setValue(arg, 0); return; } // fixer la valeur : jamais par un simple viewer
    var step = isNaN(arg) ? 1 : Math.min(Math.abs(arg), m.isMod ? 1000 : 1);
    var d = c === n + '+' ? step : -step;
    setValue(value + d, d);
  }

  SKO.params(DEFAULTS, function(p){
    P = p;
    SKO.theme(P);
    var root = document.documentElement.style;
    root.setProperty('--fs', num(P.fs, 16, 200, 64) + 'px');
    root.setProperty('--justify', P.align === 'left' ? 'flex-start' : P.align === 'right' ? 'flex-end' : 'center');
    // anciens noms de styles : neon/badge -> pill/split, minimal -> clean
    var st = { pill: 'pill', neon: 'pill', badge: 'split', split: 'split', card: 'card', big: 'big', minimal: 'clean', clean: 'clean' }[P.style] || 'pill';
    P.style = st;
    document.body.className = 'l-' + st + (P.vc === 'text' ? '' : ' v-accent');

    var k = storageKey();
    if (k !== key){
      key = k;
      var saved = SKO.store.get(key);
      value = typeof saved === 'number' ? saved : num(P.start, -999999, 999999, 0);
    }
    build();

    var sk = P.demo === '1' ? 'demo' : SKT.cleanChannel(P.ch);
    if (sk !== sourceKey){
      sourceKey = sk;
      if (source) source.close();
      var h = { status: function(s, ch){ SKO.tellParent(s, { channel: ch }); }, message: onMessage };
      source = sk === 'demo'
        ? SKT.demo(h, { min: 1500, spread: 1200, extra: function(i){
            if (i % 2) return null;
            var mod = SKT.DEMO_USERS[2];
            return SKT.fakeMessage(mod, '!' + cmdName() + (Math.random() < .85 ? '+' : '-'));
          } })
        : SKT.connect(sk, h);
    }
  });
})();
</script>
</body>
</html>
